    if (window.parent && window.parent.mavFeatures) {
        // _piActive() sudah tidak ada di window.mavFeatures sejak migrasi ke radio/UDP
        return window.parent.mavFeatures._radioActive() || window.parent.mavFeatures._udpActive();

};

function addWaypoint(lat, lon) {
    // 1. Baca nilai default dari input atau gunakan fallback bawaan
    const defaultAlt = parseFloat(document.getElementById('defaultAltInput')?.value) || 30;
    const defaultRadius = parseFloat(document.getElementById('defaultRadiusInput')?.value) || 2;

    // 2. Tentukan Altitude & Param2 (Acceptance Radius) / Param3 (Loiter Radius)
    let altVal = defaultAlt;
    let p2Val = (currentCommand === 'WAYPOINT' || currentCommand === 'TAKEOFF') ? defaultRadius : 0;
    let p3Val = currentCommand === 'LOITER' ? (defaultRadius > 2 ? defaultRadius : 15) : 0;

    if (currentCommand === 'HOME') {
        altVal = 0;
        p2Val = 0;
        p3Val = 0;
    } else if (currentCommand === 'TAKEOFF') {
        altVal = defaultAlt > 0 ? defaultAlt : 20;
    }

    const wp = {
        id: waypoints.length,
        command: currentCommand,
        lat: lat,
        lon: lon,
        alt: altVal,
        p1: 0,
        p2: p2Val, // Param 2: Acceptance Radius (meter)
        p3: p3Val, // Param 3: Loiter Radius (meter)
        p4: 0
    };

    if (currentCommand === 'HOME') {
        waypoints = waypoints.filter(item => item.command !== 'HOME');
        waypoints.unshift(wp);
    } else {
        waypoints.push(wp);
    }
    
    reindexWaypoints();
    renderWaypoints();
    updateMapPath();
    saveWaypointsLocal();
}

function updateParam(index, field, value) {
    const val = parseFloat(value);
    if (!isNaN(val)) { waypoints[index][field] = val; updateMapPath(); }
    saveWaypointsLocal();
}

function distanceMeters(lat1Deg, lon1Deg, lat2Deg, lon2Deg) {
    const R = 6371000;
    const lat1 = lat1Deg * Math.PI / 180, lon1 = lon1Deg * Math.PI / 180;
    const lat2 = lat2Deg * Math.PI / 180, lon2 = lon2Deg * Math.PI / 180;
    const dLat = lat2 - lat1, dLon = lon2 - lon1;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function isValidCoordinate(lat, lon) {
    const l1 = parseFloat(lat), l2 = parseFloat(lon);
    if (isNaN(l1) || isNaN(l2)) return false;
    return (Math.abs(l1) > 0.0001 || Math.abs(l2) > 0.0001);
}

function calculateSmoothTrajectory(wp1, wp2, stepMeters = 15) {
    const totalDistance = distanceMeters(wp1.lat, wp1.lon, wp2.lat, wp2.lon);
    const points = [];
    if (totalDistance <= stepMeters) { points.push([wp2.lat, wp2.lon]); return points; }
    const numSteps = Math.floor(totalDistance / stepMeters);
    for (let i = 0; i <= numSteps; i++) {
        const fraction = i / numSteps;
        points.push([wp1.lat + (wp2.lat - wp1.lat) * fraction, wp1.lon + (wp2.lon - wp1.lon) * fraction]);
    }
    return points;
}

function updateMapPath() {
    markers.forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
    markers = [];
    if (polyline && map.hasLayer(polyline)) map.removeLayer(polyline);

    let fullTrajectory = [];
    for (let i = 0; i < waypoints.length; i++) {
        if (i > 0) fullTrajectory = fullTrajectory.concat(calculateSmoothTrajectory(waypoints[i-1], waypoints[i]));
        else fullTrajectory.push([waypoints[i].lat, waypoints[i].lon]);
        
        const wp = waypoints[i];
        const color = wp.command === 'HOME' ? (wp.homeSource === 'confirmed' ? '#ffeb3b' : '#ff9800') : (i === 0 ? '#4caf50' : '#00bcd4');
        
        const marker = L.circleMarker([wp.lat, wp.lon], { radius: 7, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
        marker.bindTooltip(`<b>${wp.command === 'HOME' ? 'H' : i}</b>`, { permanent: true, direction: 'center', className: 'wp-text-label' });
        markers.push(marker);
    }

    if (fullTrajectory.length > 1) {
        polyline = L.polyline(fullTrajectory, { color: '#00bcd4', weight: 3, dashArray: '6, 6' }).addTo(map);
    }
}

function renderWaypoints() {
    const list = document.getElementById('waypointList');
    if (!list) return;

    if (waypoints.length === 0) { 
        list.innerHTML = `<div class="empty-state">Klik pada peta untuk menambahkan waypoint</div>`;
        updateStats(); return; 
    }
    
    let html = '';
    waypoints.forEach((wp, i) => {
        let paramInputHtml = '';
        if (wp.command === 'WAYPOINT') {
            paramInputHtml = `
                <div class="wp-param-row"><label>Hold (s):</label><input type="number" class="wp-grid-input" value="${wp.p1 || 0}" onchange="updateParam(${i}, 'p1', this.value)"></div>
                <div class="wp-param-row"><label>Rad (m):</label><input type="number" class="wp-grid-input" value="${wp.p2 !== undefined ? wp.p2 : 2}" onchange="updateParam(${i}, 'p2', this.value)"></div>
            `;
        } else if (wp.command === 'LOITER') {
            paramInputHtml = `<div class="wp-param-row"><label>Radius (m):</label><input type="number" class="wp-grid-input" value="${wp.p3 || 15}" onchange="updateParam(${i}, 'p3', this.value)"></div>`;
        }

        // --- MENU DROPDOWN PERINTAH ---
        let commandDropdown = '';
        if (wp.command === 'HOME') {
            commandDropdown = `<div class="waypoint-command" style="color: #ffeb3b; font-weight: bold; margin-bottom: 4px;">HOME</div>`;
        } else {
            const cmdList = ['TAKEOFF', 'WAYPOINT', 'LOITER', 'RTL', 'LAND'];
            let options = cmdList.map(c => `<option value="${c}" ${wp.command === c ? 'selected' : ''}>${c}</option>`).join('');
            commandDropdown = `
                <select onchange="changeWpCommand(${i}, this.value)" style="background: #222; color: #00bcd4; border: 1px solid #444; border-radius: 4px; padding: 2px 4px; font-size: 11px; font-weight: bold; margin-bottom: 4px; width: 100%; outline: none; cursor: pointer;">
                    ${options}
                </select>
            `;
        }

        // --- PROTEKSI TOMBOL HOME ---
        let actionButtons = '';
        if (wp.command === 'HOME') {
            actionButtons = `
                <button disabled style="opacity: 0.5; cursor: not-allowed;">▲</button>
                <button disabled style="opacity: 0.5; cursor: not-allowed;">▼</button>
                <button disabled style="background:#9e9e9e; color:white; border-color:#9e9e9e; cursor:not-allowed;" title="Home tidak bisa dihapus">✕</button>
            `;
        } else {
            actionButtons = `
                <button onclick="moveUp(${i})">▲</button>
                <button onclick="moveDown(${i})">▼</button>
                <button onclick="removeWaypoint(${i})" style="background:#f44336; color:white; border-color:#d32f2f;">✕</button>
            `;
        }

        html += `
        <div class="waypoint-item">
            <div class="waypoint-index">${wp.command === 'HOME' ? 'H' : i}</div>
            <div class="waypoint-info">
                ${commandDropdown}
                <div class="wp-param-row"><label>Alt (m):</label><input type="number" class="wp-grid-input" value="${wp.alt}" onchange="updateParam(${i}, 'alt', this.value)"></div>
                ${paramInputHtml}
            </div>
            <div class="waypoint-actions">
                ${actionButtons}
            </div>
        </div>`;
    });
    list.innerHTML = html;
    updateStats();
}

function changeWpCommand(index, newCommand) {
    if (index < 0 || index >= waypoints.length) return;
    if (waypoints[index].command === 'HOME') return; // Proteksi tambahan

    waypoints[index].command = newCommand;

    // Penyesuaian parameter otomatis (Reset p1-p4 agar tidak menyisakan data sampah dari perintah sebelumnya)
    const defaultAlt = parseFloat(document.getElementById('defaultAltInput')?.value) || 30;
    const defaultRadius = parseFloat(document.getElementById('defaultRadiusInput')?.value) || 2;

    if (newCommand === 'TAKEOFF') {
        waypoints[index].alt = waypoints[index].alt > 0 ? waypoints[index].alt : defaultAlt;
        waypoints[index].p1 = 0; waypoints[index].p2 = 0; waypoints[index].p3 = 0; waypoints[index].p4 = 0;
    } else if (newCommand === 'LOITER') {
        waypoints[index].p3 = defaultRadius > 2 ? defaultRadius : 15;
        waypoints[index].p1 = 0; waypoints[index].p2 = 0; waypoints[index].p4 = 0;
    } else if (newCommand === 'WAYPOINT') {
        waypoints[index].p2 = defaultRadius;
        waypoints[index].p1 = 0; waypoints[index].p3 = 0; waypoints[index].p4 = 0;
    } else if (newCommand === 'RTL' || newCommand === 'LAND') {
        waypoints[index].p1 = 0; waypoints[index].p2 = 0; waypoints[index].p3 = 0; waypoints[index].p4 = 0;
    }

    // Render ulang seluruh UI dan Garis Peta
    renderWaypoints();
    updateMapPath();
    saveWaypointsLocal();
}

function moveUp(index) {
    if (index <= 0 || waypoints[index].command === 'HOME' || (index === 1 && waypoints[0].command === 'HOME')) return;
    const temp = waypoints[index];
    waypoints[index] = waypoints[index - 1];
    waypoints[index - 1] = temp;
    reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
}

function moveDown(index) {
    if (index < 0 || index >= waypoints.length - 1 || waypoints[index].command === 'HOME') return;
    const temp = waypoints[index];
    waypoints[index] = waypoints[index + 1];
    waypoints[index + 1] = temp;
    reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
}

function removeWaypoint(index) {
    if (index < 0 || index >= waypoints.length) return;
    if (waypoints[index].command === 'HOME') return;
    waypoints.splice(index, 1);
    reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
}

function updateStats() {
    const countE1 = document.getElementById('wpCount');
    const distE1 = document.getElementById('totalDist');
    countE1.innerText = waypoints.filter(wp => wp.command !== 'HOME').length;

    let dist = 0;
    for (let i = 1; i < waypoints.length; i++) {
        dist += distanceMeters(waypoints[i-1].lat, waypoints[i-1].lon, waypoints[i].lat, waypoints[i].lon);
    }
    distE1.innerText = dist > 1000 ? (dist/1000).toFixed(2) + ' km' : Math.round(dist) + ' m';
}

function clearMission() {
    const homeWp = waypoints.find(wp => wp.command === 'HOME');
    waypoints = homeWp ? [homeWp] : [];
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    if (polyline) { 
        map.removeLayer(polyline); 
        polyline = null; 
    }
    reindexWaypoints(); 
    renderWaypoints(); 
    updateMapPath(); 
    updateStats(); 
    saveWaypointsLocal();
}

function saveMission() {
    if (waypoints.length === 0) {
        alert("Tidak ada waypoint untuk disimpan.");
        return;
    }

    // Header standar MAVLink Waypoint format 110
    let fileContent = "QGC WPL 110\n";

    // Konversi setiap waypoint ke format 12 kolom QGC / Mission Planner
    waypoints.forEach((wp, index) => {
        const isHome = (index === 0 || wp.command === 'HOME');
        const currentWp = isHome ? 1 : 0;
        const frame = 3; // MAV_FRAME_GLOBAL_RELATIVE_ALT (3)

        // Mapping MAVLink Command ID
        let commandId = 16; // MAV_CMD_NAV_WAYPOINT
        if (wp.command === 'TAKEOFF') commandId = 22;      // MAV_CMD_NAV_TAKEOFF
        else if (wp.command === 'LOITER') commandId = 19;  // MAV_CMD_NAV_LOITER_TIME
        else if (wp.command === 'RTL') commandId = 20;     // MAV_CMD_NAV_RETURN_TO_LAUNCH
        else if (wp.command === 'LAND') commandId = 21;    // MAV_CMD_NAV_LAND
        else if (wp.command === 'HOME') commandId = 16;

        // Di dalam loop saveMission():
        const p1 = (wp.p1 !== undefined) ? Number(wp.p1).toFixed(6) : "0.000000";
        const p2 = (wp.p2 !== undefined) ? Number(wp.p2).toFixed(6) : "2.000000"; // Acceptance Radius
        const p3 = (wp.p3 !== undefined) ? Number(wp.p3).toFixed(6) : "0.000000"; // Loiter Radius
        const p4 = (wp.p4 !== undefined) ? Number(wp.p4).toFixed(6) : "0.000000";
        const lat = Number(wp.lat).toFixed(7);
        const lon = Number(wp.lon).toFixed(7);
        const alt = Number(wp.alt || 0).toFixed(6);
        const autocontinue = 1;

        // Susun 12 kolom dengan pemisah tab (\t)
        fileContent += `${index}\t${currentWp}\t${frame}\t${commandId}\t${p1}\t${p2}\t${p3}\t${p4}\t${lat}\t${lon}\t${alt}\t${autocontinue}\n`;
    });

    // Trigger download file .waypoints
    const blob = new Blob([fileContent], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mission.waypoints';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

let geofencePolygon = null;

function renderFencePolygon() {
    if (geofencePolygon) { map.removeLayer(geofencePolygon); geofencePolygon = null; }
    if (fenceVertices.length < 3) return;
    
    const latlngs = fenceVertices.map(p => [p.lat, p.lon]);

function renderFenceVertexMarkers() {
    fenceVertexMarkers.forEach(m => map.removeLayer(m));
    fenceVertexMarkers = fenceVertices.map((p, idx) => {
        const icon = L.divIcon({ className: 'fence-vertex-icon', iconSize: [14, 14], iconAnchor: [7, 7] });

            fenceVertices.splice(idx, 1);
            refreshFenceUI();
            map.closePopup(); // Tutup context menu jika titik di-klik kanan

        return marker;
    });

const EARTH_RADIUS_M = 6371000;

function llToLocalXY(lat, lon, refLat, refLon) {
    const x = (lon - refLon) * Math.PI / 180 * EARTH_RADIUS_M * Math.cos(refLat * Math.PI / 180);
    const y = (lat - refLat) * Math.PI / 180 * EARTH_RADIUS_M;
    return { x, y };
}

function localXYToLl(x, y, refLat, refLon) {
    const lat = refLat + (y / EARTH_RADIUS_M) * 180 / Math.PI;
    const lon = refLon + (x / (EARTH_RADIUS_M * Math.cos(refLat * Math.PI / 180))) * 180 / Math.PI;
    return { lat, lon };
}

function rotatePoint(p, angleRad) {
    const cosA = Math.cos(angleRad), sinA = Math.sin(angleRad);
    return { x: p.x * cosA - p.y * sinA, y: p.x * sinA + p.y * cosA };
}

function polygonCentroidLl(vertices) {
    let sumLat = 0, sumLon = 0;
    vertices.forEach(v => { sumLat += v.lat; sumLon += v.lon; });
    return { lat: sumLat / vertices.length, lon: sumLon / vertices.length };
}

function isPointInPolygon(point, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;
        const intersect = ((yi > point.y) !== (yj > point.y))
            && (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

function intersectionsAtY(poly, y) {
    const xs = [];
    const n = poly.length;
    for (let i = 0; i < n; i++) {
        const a = poly[i], b = poly[(i + 1) % n];
        if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
            // Hindari pembagian dengan nol
            if (Math.abs(b.y - a.y) > 1e-6) {
                const t = (y - a.y) / (b.y - a.y);
                xs.push(a.x + t * (b.x - a.x));
            }
        }
    }
    xs.sort((v1, v2) => v1 - v2);
    return xs;
}

function generateScanWaypoints(spacingM, angleDeg, startLatLng = null) {
    if (fenceVertices.length < 3) return [];

    const ref = polygonCentroidLl(fenceVertices);
    const xy = fenceVertices.map(p => llToLocalXY(p.lat, p.lon, ref.lat, ref.lon));

    // Sudut sapuan otomatis atau manual
    let angleRad = 0;
    if (angleDeg !== null && angleDeg !== undefined && !isNaN(angleDeg)) {
        angleRad = angleDeg * Math.PI / 180;
    } else {
        let maxLen = -1, bestAngle = 0;
        for (let i = 0; i < xy.length; i++) {
            const a = xy[i], b = xy[(i + 1) % xy.length];
            const dx = b.x - a.x, dy = b.y - a.y;
            const len = Math.hypot(dx, dy);
            if (len > maxLen) { maxLen = len; bestAngle = Math.atan2(dy, dx); }
        }
        angleRad = bestAngle;
    }

    const rotPoly = xy.map(p => rotatePoint(p, -angleRad));
    const ysAll = rotPoly.map(p => p.y);
    const yMin = Math.min(...ysAll), yMax = Math.max(...ysAll);

    const marginM = Math.min(spacingM * 0.4, 5); // Inset batas aman
    
    // 1. Kumpulkan segmen garis horizontal valid di dalam poligon
    let segments = [];
    for (let y = yMin + marginM + (spacingM / 2); y <= yMax - marginM; y += spacingM) {
        const xs = intersectionsAtY(rotPoly, y);
        for (let i = 0; i + 1 < xs.length; i += 2) {
            let xLeft = xs[i];
            let xRight = xs[i + 1];

            if ((xRight - xLeft) > marginM * 2) {
                xLeft += marginM;
                xRight -= marginM;
            }

            const midPoint = { x: (xLeft + xRight) / 2, y: y };
            if (isPointInPolygon(midPoint, rotPoly)) {
                segments.push({
                    y: y,
                    p1: { x: xLeft, y: y },
                    p2: { x: xRight, y: y },
                    visited: false
                });
            }
        }
    }

    if (segments.length === 0) return [];

    // 2. Tentukan Titik Awal berdasarkan Posisi Klik Peta
    let initialPos = segments[0].p1;

    if (startLatLng && isValidCoordinate(startLatLng.lat, startLatLng.lng)) {
        const clickLocal = llToLocalXY(startLatLng.lat, startLatLng.lng, ref.lat, ref.lon);
        const clickRot = rotatePoint(clickLocal, -angleRad);

        let bestStartDist = Infinity;
        segments.forEach(seg => {
            const d1 = Math.hypot(seg.p1.x - clickRot.x, seg.p1.y - clickRot.y);
            const d2 = Math.hypot(seg.p2.x - clickRot.x, seg.p2.y - clickRot.y);
            if (d1 < bestStartDist) { bestStartDist = d1; initialPos = seg.p1; }
            if (d2 < bestStartDist) { bestStartDist = d2; initialPos = seg.p2; }
        });
    }

    // 3. Bangun Rute Waypoint (Nearest-Neighbor)
    const orderedPoints = [];
    let currentPos = initialPos;
    
    while (true) {
        let bestDist = Infinity;
        let bestSegIndex = -1;
        let bestEntry = null;
        let bestExit = null;

        for (let i = 0; i < segments.length; i++) {
            const seg = segments[i];
            if (seg.visited) continue;

            const d1 = Math.hypot(seg.p1.x - currentPos.x, seg.p1.y - currentPos.y);
            const d2 = Math.hypot(seg.p2.x - currentPos.x, seg.p2.y - currentPos.y);

            if (d1 < bestDist) {
                bestDist = d1;
                bestSegIndex = i;
                bestEntry = seg.p1;
                bestExit = seg.p2;
            }
            if (d2 < bestDist) {
                bestDist = d2;
                bestSegIndex = i;
                bestEntry = seg.p2;
                bestExit = seg.p1;
            }
        }

        if (bestSegIndex === -1) break;

        segments[bestSegIndex].visited = true;
        orderedPoints.push(bestEntry);
        orderedPoints.push(bestExit);
        currentPos = bestExit;
    }

    // 4. Konversi balik ke Lat/Lon
    return orderedPoints.map(p => {
        const back = rotatePoint(p, angleRad);
        return localXYToLl(back.x, back.y, ref.lat, ref.lon);
    });
}

function addScanAreaToMission(spacingM, altitude, angleDeg, replaceExisting) {
    const pts = generateScanWaypoints(spacingM, angleDeg);
    if (pts.length === 0) {
        alert('Gagal membuat pola scan. Pastikan polygon geofence sudah dibuat (minimal 3 titik) dan spacing tidak terlalu besar.');
        return;
    }

    if (replaceExisting) {
        waypoints = waypoints.filter(wp => wp.command === 'HOME');
    }

    pts.forEach(p => {
        waypoints.push({
            id: waypoints.length, command: 'WAYPOINT', lat: p.lat, lon: p.lon,
            alt: altitude, p1: 0, p2: 0, p3: 0, p4: 0
        });
    });

    reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
    alert(`${pts.length} waypoint area (scan) berhasil dibuat dari polygon geofence.\nGunakan tombol "Upload to FC" untuk mengirim ke Flight Controller.`);
}

        const dropdown = L.DomUtil.create('div', 'polygon-dropdown', container);
        dropdown.id = 'polygonDropdown';

        // Mencegah klik tembus ke peta di belakangnya
        L.DomEvent.disableClickPropagation(container);

        // Buka/tutup menu saat tombol diklik
        L.DomEvent.on(btn, 'click', function(e) {
            updatePolygonDropdown();
            dropdown.classList.toggle('show');
        });

        // Tutup menu otomatis jika area peta lain diklik
        map.on('click', function() {
            dropdown.classList.remove('show');
        });

        return container;
    }
});

// Inisialisasi tombol ke peta
map.addControl(new L.Control.PolygonMenu());

// Fungsi untuk memperbarui item menu di dalam Dropdown
window.updatePolygonDropdown = function() {
    const dropdown = document.getElementById('polygonDropdown');
    if (!dropdown) return;

    let menuItems = `
        <button onclick="toggleFenceEditMode(); closePolygonDropdown();">
            ${fenceEditMode ? 'Finish Polygon' : 'Draw a Polygon'}
        </button>
    `;

    if (!fenceEditMode) {
        menuItems += `
            <button onclick="clearFenceEverywhere(); closePolygonDropdown();">Clear Polygon</button>
            <button onclick="downloadFenceFromFC(); closePolygonDropdown();">Load Polygon</button>
        `;
        if (fenceVertices.length >= 3) {
            menuItems += `
                <button onclick="openScanAreaModal(); closePolygonDropdown();">Generate Scan Waypoints</button>
            `;
        }
    }

    if (fenceEditMode && fenceVertices.length >= 3) {
        menuItems += `
            <button onclick="uploadFenceToFC(); closePolygonDropdown();">Save Polygon</button>
        `;
    }

    dropdown.innerHTML = menuItems;
};

// Helper untuk menutup dropdown setelah eksekusi perintah
window.closePolygonDropdown = function() {
    const dropdown = document.getElementById('polygonDropdown');
    if (dropdown) dropdown.classList.remove('show');
};

// ===== ALTITUDE EDITING =====
let editingWaypointIndex = -1;

function openEditAltitude(index) {
    editingWaypointIndex = index;
    document.getElementById('waypointNum').innerText = index + 1;
    document.getElementById('altitudeInput').value = waypoints[index].alt;
    document.getElementById('altitudeModal').style.display = 'block';
    setTimeout(() => document.getElementById('altitudeInput').focus(), 100);
}

function closeEditAltitude() {
    document.getElementById('altitudeModal').style.display = 'none';
    editingWaypointIndex = -1;
}

function saveAltitude() {
    const newAlt = parseInt(document.getElementById('altitudeInput').value);
    if (isNaN(newAlt) || newAlt < 0) return alert('Please enter a valid altitude value');
    waypoints[editingWaypointIndex].alt = newAlt;
    renderWaypoints(); updateMapPath(); updateStats(); closeEditAltitude();
}

window.onclick = function(event) {
    const modal = document.getElementById('altitudeModal');
    if (event.target == modal) closeEditAltitude();
    const scanModal = document.getElementById('scanAreaModal');
    if (event.target == scanModal) closeScanAreaModal();
}

// ===== DRONE TRACKING MENGGUNAKAN DATA PARENT =====
let droneMarker = null;
function trackDronePosition() {
    setInterval(() => {
        if (!isConnected()) return;
        
        // Ambil data dari objek telemetry milik Parent
        const telemetry = window.parent.gcsConnection.telemetry ? window.parent.gcsConnection.telemetry.data : null;
        if (!telemetry) return;

        if (isValidCoordinate(telemetry.lat, telemetry.lon)) {
            updateDroneMarker(telemetry.lat, telemetry.lon, telemetry.heading || 0);
        }

        // HOME_POSITION (msg 242) dari FC -- ini sumber CONFIRMED, satu-satunya yang aman
        // dijadikan dasar upload home ke FC (lihat guard di uploadMissionToFC() di bawah).
        if (telemetry.home_lat !== undefined && isValidCoordinate(telemetry.home_lat, telemetry.home_lon)) {
            let homeIndex = waypoints.findIndex(wp => wp.command === 'HOME');
            if (homeIndex === -1) {
                waypoints.unshift({ id: 0, command: 'HOME', lat: telemetry.home_lat, lon: telemetry.home_lon, alt: telemetry.home_alt || 0, homeSource: 'confirmed' });
                reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
            } else if (!isValidCoordinate(waypoints[homeIndex].lat, waypoints[homeIndex].lon) || waypoints[homeIndex].homeSource !== 'confirmed') {
                waypoints[homeIndex].lat = telemetry.home_lat;
                waypoints[homeIndex].lon = telemetry.home_lon;
                waypoints[homeIndex].alt = telemetry.home_alt || 0;
                waypoints[homeIndex].homeSource = 'confirmed';
                renderWaypoints(); updateMapPath(); saveWaypointsLocal();
            }
        }
    }, 500);
}

function updateDroneMarker(lat, lon, heading) {
    if (!droneMarker) {
        const droneIcon = L.divIcon({
            html: '<div class="drone-marker" style="transform: rotate(' + heading + 'deg);"></div>',
            iconSize: [36, 36], iconAnchor: [18, 18], className: 'drone-icon'
        });
        droneMarker = L.marker([lat, lon], { icon: droneIcon, zIndexOffset: 500 })
            .bindPopup('<b>Drone</b><br>Lat: ' + lat.toFixed(6) + '<br>Lon: ' + lon.toFixed(6) + '<br>Heading: ' + heading.toFixed(0) + '°')
            .addTo(map);
    } else {
        droneMarker.setLatLng([lat, lon]);
        const icon = droneMarker.getIcon();
        icon.options.html = '<div class="drone-marker" style="transform: rotate(' + heading + 'deg);"></div>';
        droneMarker.setIcon(icon);
    }
}

async function uploadMissionToFC() {
    if (waypoints.length === 0) return alert('No waypoints to upload.');
    try {
        const btn = document.querySelector('.sidebar-footer button.primary');
        const originalText = btn.innerText;
        btn.innerText = 'Uploading...'; btn.disabled = true;

        const hasHome = waypoints.length > 0 && waypoints[0].command === 'HOME';
        if (!hasHome) {
            let autoLat, autoLon;

            if (waypoints.length > 0 && isValidCoordinate(waypoints[0].lat, waypoints[0].lon)) {
                autoLat = waypoints[0].lat - 0.00003;
                autoLon = waypoints[0].lon - 0.00003;
            } else {
                const tel = window.parent?.gcsConnection?.telemetry?.data;
                if (tel && isValidCoordinate(tel.home_lat, tel.home_lon)) {
                    autoLat = tel.home_lat; autoLon = tel.home_lon;
                } else if (tel && isValidCoordinate(tel.lat, tel.lon) && (tel.gps_fix_type || 0) >= 3) {
                    autoLat = tel.lat; autoLon = tel.lon;
                } else {
                    const center = map.getCenter();
                    autoLat = center.lat; autoLon = center.lng;
                    if (!confirm('Tidak ada GPS fix valid dan tidak ada HOME_POSITION dari FC. HOME akan dibuat dari titik tengah peta (BUKAN posisi asli) -- lanjutkan upload?')) {
                        btn.innerText = originalText; btn.disabled = false;
                        return;
                    }
                }
            }

            waypoints.unshift({
                id: 0, command: 'HOME', lat: autoLat, lon: autoLon, alt: 0,
                p1: 0, p2: 0, p3: 0, p4: 0
            });
            
            reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
        }

        // --- KONVERSI MAVLINK ---
        const items = waypoints.map(wp => {
            let mavCmd = 16; 
            if (wp.command === 'HOME') mavCmd = 16;
            else if (wp.command === 'TAKEOFF') mavCmd = 22;
            else if (wp.command === 'LOITER') mavCmd = 19;
            else if (wp.command === 'RTL') mavCmd = 20;
            else if (wp.command === 'LAND') mavCmd = 21;

            return {
                frame: 3, // MAV_FRAME_GLOBAL
                command: mavCmd,
                param1: wp.p1 || 0,
                param2: wp.p2 || 0,
                param3: wp.p3 || 0,
                param4: wp.p4 || 0,
                x: Math.round(wp.lat * 1e7),
                y: Math.round(wp.lon * 1e7),
                z: wp.alt || 0
            };
        });

        const result = await window.parent.mavFeatures.uploadMission(items);
        alert(result.ok ? 'Mission uploaded successfully!' : 'Upload failed: ' + result.message);
        btn.innerText = originalText; btn.disabled = false;
    } catch (err) {
        alert('Error: ' + err.message);
        const btn = document.querySelector('.sidebar-footer button.primary');
        btn.innerText = 'Upload to FC'; btn.disabled = false;
    }
}
async function readMissionFromFC() {
    try {
        const btn = document.querySelector('button[title="Read mission from FC"]');
        const originalText = btn.innerText;
        btn.innerText = 'Reading...'; btn.disabled = true;

        if (window.parent.mavFeatures && typeof window.parent.mavFeatures.requestHomePosition === 'function') {
            window.parent.mavFeatures.requestHomePosition();
        }

        const items = await window.parent.mavFeatures.downloadMission();
        const hometerakhir = waypoints.find(wp => wp.command === 'HOME');
        const tel = window.parent?.gcsConnection?.telemetry?.data;

        let loadedWaypoints = [];
        let fcHome = null;
        let lastLat = 0; let lastLon = 0;

        items.forEach((item, idx) => {
            const lat = item.x / 1e7;
            const lon = item.y / 1e7;
            const koorValid = isValidCoordinate(lat, lon);

            if (idx === 0) {
                // --- LOGIKA HOME DENGAN PERGESERAN 3 METER ---
                let homeLat = lat;
                let homeLon = lon;

                if (!koorValid) {
                    // Cari waypoint valid pertama di daftar misi FC
                    const firstValid = items.find(i => isValidCoordinate(i.x / 1e7, i.y / 1e7));
                    
                    if (firstValid) {
                        // Geser 3 meter dari Waypoint 1
                        homeLat = (firstValid.x / 1e7) - 0.00003; 
                        homeLon = (firstValid.y / 1e7) - 0.00003;
                    } else if (hometerakhir && isValidCoordinate(hometerakhir.lat, hometerakhir.lon)) {
                        homeLat = hometerakhir.lat; homeLon = hometerakhir.lon; 
                    } else if (tel && isValidCoordinate(tel.home_lat, tel.home_lon)) {
                        homeLat = tel.home_lat; homeLon = tel.home_lon; 
                    } else if (tel && isValidCoordinate(tel.lat, tel.lon) && (tel.gps_fix_type || 0) >= 3) {
                        homeLat = tel.lat; homeLon = tel.lon; 
                    } else {
                        const center = map.getCenter();
                        homeLat = center.lat; homeLon = center.lng;
                    }
                }

                fcHome = { id: 0, command: 'HOME', lat: homeLat, lon: homeLon, alt: item.z, p1:0, p2:0, p3:0, p4:0 };
                lastLat = homeLat; lastLon = homeLon;

            } else {
                // --- LOGIKA WAYPOINT BIASA ---
                let wpLat = koorValid ? lat : lastLat;
                let wpLon = koorValid ? lon : lastLon;

                let cmdString = 'WAYPOINT';
                if (item.command === 22) cmdString = 'TAKEOFF';
                else if (item.command === 19) cmdString = 'LOITER';
                else if (item.command === 20) cmdString = 'RTL';
                else if (item.command === 21) cmdString = 'LAND';

                loadedWaypoints.push({
                    id: idx, command: cmdString, lat: wpLat, lon: wpLon, alt: item.z,
                    p1: item.param1 || 0, p2: item.param2 || 0, p3: item.param3 || 0, p4: item.param4 || 0
                });

                if (koorValid) { lastLat = lat; lastLon = lon; }
            }
        });

        if (items.length === 0) {
            alert('Tidak ada mission di FC (0 item).');
            btn.innerText = originalText; btn.disabled = false;
            return;
        }

        waypoints = fcHome ? [fcHome, ...loadedWaypoints] : loadedWaypoints;
        reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();

        alert('Mission loaded from FC! (' + items.length + ' items)');
        btn.innerText = originalText; btn.disabled = false;
    } catch (err) {
        alert('Error reading mission: ' + err.message);
        const btn = document.querySelector('button[title="Read mission from FC"]');
        btn.innerText = 'Read'; btn.disabled = false;
    }
}

async function updateMissionStatus() {
    const statusEl = document.getElementById('missionStatus');
    if (!isConnected()) {
        statusEl.innerText = 'Not connected';
        statusEl.style.color = '#888';
        return;
    }
    
    statusEl.innerText = `Connected (${waypoints.filter(wp => wp && wp.command !== 'HOME').length} items)`;
    statusEl.style.color = '#00bcd4';
}

window.setHomeHere = async function(lat, lon) {
    try {
        const result = await window.parent.mavFeatures.setHome(lat, lon);
        if (result.ok) {
            let homeIndex = waypoints.findIndex(wp => wp.command === 'HOME');
            const newHome = { id: 0, command: 'HOME', lat, lon, alt: 0, p1:0,p2:0,p3:0,p4:0 };
            if (homeIndex !== -1) waypoints[homeIndex] = newHome;
            else waypoints.unshift(newHome);
            reindexWaypoints(); renderWaypoints(); updateMapPath(); saveWaypointsLocal();
            map.closePopup();
            alert('Home position set!');
        } else {
            alert('Failed to set home: ' + result.message);
        }
    } catch (err) {
        alert('Error: ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    trackDronePosition();
    setInterval(updateMissionStatus, 5000);
    
    const altInput = document.getElementById('altitudeInput');
    if (altInput) {
        altInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveAltitude();
        });
    }
});
</script>
