<script src="./static/js/leaflet.js"></script>
<script>
// ===== MAP INITIALIZATION =====
let map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-7.25, 112.75], 13);
L.control.zoom({position: 'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri',
    maxZoom: 19
}).addTo(map);

setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());

let droneMarker = null;
let missionMarkers = [];
let missionPolyline = null;

// ===== WAYPOINT RENDERING =====
function calculateFlightSmoothTrajectory(wp1, wp2, stepMeters = 15) {
    const R = 6371000;
    const lat1 = wp1.lat * Math.PI / 180, lon1 = wp1.lon * Math.PI / 180;
    const lat2 = wp2.lat * Math.PI / 180, lon2 = wp2.lon * Math.PI / 180;
    const dLat = lat2 - lat1, dLon = lon2 - lon1;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2)**2;
    const totalDistance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    const points = [];
    if (totalDistance <= stepMeters) { points.push([wp2.lat, wp2.lon]); return points; }
    const numSteps = Math.floor(totalDistance / stepMeters);
    for (let i = 0; i <= numSteps; i++) {
        const fraction = i / numSteps;
        points.push([wp1.lat + (wp2.lat - wp1.lat) * fraction, wp1.lon + (wp2.lon - wp1.lon) * fraction]);
    }
    return points;
}

window.loadAndRenderMissionOnFlightView = function() {
    if (!map) return;
    missionMarkers.forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
    missionMarkers = [];
    if (missionPolyline && map.hasLayer(missionPolyline)) {
        map.removeLayer(missionPolyline);
        missionPolyline = null;
    }

    const saved = localStorage.getItem('hawkeye_mission');
    if (!saved) return;

    try {
        const waypoints = JSON.parse(saved);
        if (!Array.isArray(waypoints) || waypoints.length === 0) return;

        let fullTrajectory = [];
        for (let i = 0; i < waypoints.length; i++) {
            const wp = waypoints[i];
            if (!wp || typeof wp.lat !== 'number' || typeof wp.lon !== 'number') continue;

            if (i > 0) {
                fullTrajectory = fullTrajectory.concat(calculateFlightSmoothTrajectory(waypoints[i-1], wp));
            } else {
                fullTrajectory.push([wp.lat, wp.lon]);
            }

            const isHome = wp.command === 'HOME';
            const color = isHome ? '#ffeb3b' : (i === 1 ? '#4caf50' : '#00bcd4');

            const marker = L.circleMarker([wp.lat, wp.lon], {
                radius: 6, fillColor: color, color: '#ffffff', weight: 2, fillOpacity: 0.9, zIndexOffset: 300
            }).addTo(map);

            marker.bindTooltip(`<b>${isHome ? 'H' : i}</b>`, { permanent: true, direction: 'center', className: 'wp-text-label' });
            marker.bindPopup(`<b>${wp.command} #${isHome ? 'HOME' : i}</b><br>Alt: ${wp.alt || 0}m<br>Lat: ${wp.lat.toFixed(6)}<br>Lon: ${wp.lon.toFixed(6)}`);
            missionMarkers.push(marker);
        }

        if (fullTrajectory.length > 1) {
            missionPolyline = L.polyline(fullTrajectory, { color: '#ff9800', weight: 2.5, opacity: 0.85, dashArray: '5, 5' }).addTo(map);
        }
    } catch (e) {
        console.warn("[FlightView] Gagal merender rute mission:", e);
    }
};

loadAndRenderMissionOnFlightView();

window.addEventListener('storage', (e) => {
    if (e.key === 'hawkeye_mission') loadAndRenderMissionOnFlightView();
});
window.addEventListener('message', (e) => {
    if (e.data === 'MISSION_UPDATED') loadAndRenderMissionOnFlightView();
});

// ===== ARTIFICIAL HORIZON (GYRO) =====
// ===== ARTIFICIAL HORIZON (GYRO) =====
const gyroCanvas = document.getElementById('gyroCanvas');
const gyroCtx = gyroCanvas.getContext('2d');

// ===== COMPASS CANVAS (N-E-S-W FIXED, ROTATING NEEDLE) =====
const compassCanvas = document.getElementById('compassCanvas');
const compassCtx = compassCanvas.getContext('2d');

function drawCompass(yawDeg) {
    if (!isFinite(yawDeg)) yawDeg = 0;
    const ctx = compassCtx;
    const width = compassCanvas.width;
    const height = compassCanvas.height;
    const cx = width / 2;
    const cy = height / 2;
    const radius = Math.min(cx, cy) - 6;

    ctx.clearRect(0, 0, width, height);
    ctx.save();

    // 1. Background Lingkaran Kompas
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(15, 15, 25, 0.95)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#555555";
    ctx.stroke();

    // 2. Render Tick & Label Mata Angin (FIXED / Diam di tempat)
    for (let i = 0; i < 360; i += 10) {
        const rad = (i - 90) * Math.PI / 180;
        const isMajor = i % 30 === 0;
        const innerR = radius - (isMajor ? 8 : 4);

        const x1 = cx + radius * Math.cos(rad);
        const y1 = cy + radius * Math.sin(rad);
        const x2 = cx + innerR * Math.cos(rad);
        const y2 = cy + innerR * Math.sin(rad);

        ctx.strokeStyle = isMajor ? "#ffffff" : "#777777";
        ctx.lineWidth = isMajor ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        if (i % 90 === 0) {
            const textR = radius - 16;
            const tx = cx + textR * Math.cos(rad);
            const ty = cy + textR * Math.sin(rad);

            ctx.font = "bold 10px Arial";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let label = "N";
            if (i === 90) label = "E";
            else if (i === 180) label = "S";
            else if (i === 270) label = "W";
            ctx.fillText(label, tx, ty);
        }
    }

    // 3. Jarum Penunjuk (Berputar sesuai Yaw / Heading Drone)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((yawDeg - 90) * Math.PI / 180);

    // Jarum Utama (Merah menghadap arah heading)
    ctx.fillStyle = "#ff1744";
    ctx.beginPath();
    ctx.moveTo(radius - 12, 0);
    ctx.lineTo(-5, -5);
    ctx.lineTo(-5, 5);
    ctx.closePath();
    ctx.fill();

    // Jarum Belakang (Abu-abu)
    ctx.fillStyle = "#888888";
    ctx.beginPath();
    ctx.moveTo(-(radius - 12), 0);
    ctx.lineTo(5, -5);
    ctx.lineTo(5, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 4. Kotak Angka Heading di Tengah Kompas
    const boxW = 38, boxH = 18;
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(cx - boxW/2, cy - boxH/2, boxW, boxH);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(cx - boxW/2, cy - boxH/2, boxW, boxH);

    const headingFormatted = String(Math.round(((yawDeg % 360) + 360) % 360)).padStart(3, '0') + '°';
    ctx.font = "bold 10px Arial";
    ctx.fillStyle = "#00bcd4";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(headingFormatted, cx, cy);

    ctx.restore();
}

function resizeCanvas() {
    const parent = gyroCanvas.parentElement;
    if (gyroCanvas.width !== parent.clientWidth || gyroCanvas.height !== parent.clientHeight) {
        gyroCanvas.width = parent.clientWidth;
        gyroCanvas.height = parent.clientHeight;
    }
}

function DrawEllipse(ctx, color, linewidth, x, y, width, height) {
    ctx.lineWidth = linewidth; ctx.strokeStyle = color; ctx.beginPath();
    ctx.arc(x + width/2, y + height/2, width/2, 0, 2 * Math.PI); ctx.stroke();
}
function DrawLine(ctx, color, width, x1, y1, x2, y2) {
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function DrawPolygon(ctx, color, width, list) {
    ctx.lineWidth = width; ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(list[0], list[1]);
    for (let i = 2; i < list.length; i += 2) ctx.lineTo(list[i], list[i+1]);
    ctx.closePath(); ctx.fill();
}
function drawstring(ctx, string, font, fontsize, color, x, y) {
    ctx.font = "bold " + fontsize + "px " + font; ctx.fillStyle = color;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(string, x, y);
}

function drawArtificialHorizon(rollDeg, pitchDeg, yawDeg) {
    if (!isFinite(rollDeg)) rollDeg = 0;
    if (!isFinite(pitchDeg)) pitchDeg = 0;
    if (!isFinite(yawDeg)) yawDeg = 0;

    resizeCanvas();
    drawCompass(yawDeg);
    const deg2rad = Math.PI / 180;
    const canvas = gyroCanvas, ctx = gyroCtx;
    
    if (canvas.width === 0 || canvas.height === 0) return; 
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const width = canvas.width;
    const height = canvas.height;

    // 1. Gambar Dasar Horizon (Pitch & Roll)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rollDeg * deg2rad);

    const font = "Arial";
    const fontsize = Math.max(9, height / 18);
    const halfwidth = cx, halfheight = cy;
    const every5deg = -height / 60;
    const pitchoffset = -pitchDeg * every5deg;

    const gradObj = ctx.createLinearGradient(0, -halfheight * 2, 0, halfheight * 2);
    gradObj.addColorStop(0.0, "#1976d2"); 
    let offset = Math.max(0, Math.min(1, 0.5 + pitchoffset / height / 2));
    gradObj.addColorStop(offset, "#64b5f6");
    gradObj.addColorStop(offset, "#8bc34a"); 
    gradObj.addColorStop(1.0, "#33691e");

    ctx.fillStyle = gradObj;
    ctx.fillRect(-halfwidth * 2, -halfheight * 2, halfwidth * 4, halfheight * 4);

    const lengthshort = width / 18, lengthlong = width / 12;
    for (let a = -90; a <= 90; a += 5) {
        if (a >= pitchDeg - 34 && a <= pitchDeg + 25) { 
            let yPos = pitchoffset + a * every5deg;
            if (a % 10 == 0) {
                DrawLine(ctx, "White", 2, -lengthlong, yPos, lengthlong, yPos);
                if (a !== 0) {
                    drawstring(ctx, a, font, fontsize, "White", -lengthlong - 12, yPos);
                    drawstring(ctx, a, font, fontsize, "White", lengthlong + 12, yPos);
                }
            } else {
                DrawLine(ctx, "White", 1, -lengthshort, yPos, lengthshort, yPos);
            }
        }
    }

    const extra = height / 15 * 4.9, llex = height / 66 + 2;
    DrawPolygon(ctx, "RED", 1, [0, -llex*2 - extra, -llex, -llex - extra, llex, -llex - extra]);
    for (let a = -60; a <= 60; a += 15) {
        ctx.restore(); ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a * deg2rad);
        drawstring(ctx, Math.abs(a), font, fontsize - 1, "White", 0, -llex * 8 - extra + 12);
        DrawLine(ctx, "White", 2, 0, -llex * 3 - extra, 0, -llex * 3 - extra - llex);
    }

    ctx.restore(); ctx.save();

    // Crosshair Tengah
    DrawEllipse(ctx, "red", 2, cx - 8, cy - 8, 16, 16);
    DrawLine(ctx, "red", 2, cx - 20, cy, cx - 8, cy);
    DrawLine(ctx, "red", 2, cx + 8, cy, cx + 20, cy);
    DrawLine(ctx, "red", 2, cx, cy - 8, cx, cy - 20);

    // Tape Kompas Bawah
    const tapeHeight = 18, topY = height - tapeHeight, centerY = height - (tapeHeight / 2);
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(0, topY, width, tapeHeight);
    DrawLine(ctx, "white", 1.5, 0, topY, width, topY);

    const space = (width - 10) / 120.0, start = Math.round(yawDeg - 60);
    for (let a = start; a <= yawDeg + 60; a += 1) {
        let xPos = 5 + space * (a - start);
        if (a % 15 == 0) {
            DrawLine(ctx, "white", 1.5, xPos, height, xPos, topY + 2);
            let disp = ((a % 360) + 360) % 360;
            let label = disp;
            if(disp===0) label="N"; else if(disp===45) label="NE"; else if(disp===90) label="E"; else if(disp===135) label="SE";
            else if(disp===180) label="S"; else if(disp===225) label="SW"; else if(disp===270) label="W"; else if(disp===315) label="NW";
            drawstring(ctx, label, font, fontsize - 1, "white", xPos, centerY + 1);
        }
        if (a === Math.round(yawDeg)) {
            DrawLine(ctx, "red", 2, xPos, height, xPos, topY);
        }
    }

    // =========================================================================
    // 2. PITA KIRI (KECEPATAN / SPEED TAPE)
    // =========================================================================
    var speedBoxX = 4;
    var speedBoxY = 18;
    var speedBoxW = 42;
    var speedBoxH = height - 44;

    ctx.save();
    ctx.beginPath();
    ctx.rect(speedBoxX, speedBoxY, speedBoxW, speedBoxH);
    ctx.clip();

    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(speedBoxX, speedBoxY, speedBoxW, speedBoxH);

    var pixelsPerSpeedUnit = 16;
    var currentSpeed = window.lastTelemetry?.speed || 0; 

    for (var s = Math.floor(currentSpeed - 4); s <= Math.ceil(currentSpeed + 4); s += 1) {
        var yPosSpeed = cy - (s - currentSpeed) * pixelsPerSpeedUnit;
        if (yPosSpeed < speedBoxY || yPosSpeed > speedBoxY + speedBoxH) continue;

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(speedBoxX + speedBoxW, yPosSpeed);
        ctx.lineTo(speedBoxX + speedBoxW - 6, yPosSpeed);
        ctx.stroke();

        ctx.font = "9px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.fillText(s.toFixed(0), speedBoxX + 4, yPosSpeed + 3);
    }
    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(speedBoxX, speedBoxY, speedBoxW, speedBoxH);

    // Pointer Tengah Kecepatan
    ctx.fillStyle = "#ff9800";
    ctx.beginPath();
    ctx.moveTo(speedBoxX + speedBoxW, cy);
    ctx.lineTo(speedBoxX + speedBoxW + 5, cy - 4);
    ctx.lineTo(speedBoxX + speedBoxW + 5, cy + 4);
    ctx.fill();

    // Box Nilai Tengah Kecepatan
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(speedBoxX, cy - 8, speedBoxW, 16);
    ctx.strokeStyle = "#ff9800";
    ctx.strokeRect(speedBoxX, cy - 8, speedBoxW, 16);

    ctx.font = "bold 9px sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.fillText(currentSpeed.toFixed(1), speedBoxX + (speedBoxW / 2), cy + 3);

    // Teks AS & GS di bawah pita kecepatan
    ctx.font = "8px sans-serif";
    ctx.fillStyle = "#00bcd4";
    ctx.textAlign = "left";
    ctx.fillText("AS:" + currentSpeed.toFixed(1), speedBoxX, speedBoxY + speedBoxH + 10);
    ctx.fillText("GS:" + currentSpeed.toFixed(1), speedBoxX, speedBoxY + speedBoxH + 19);

    // =========================================================================
    // 3. PITA KANAN (ALTITUDE TAPE)
    // =========================================================================
    var altBoxW = 42;
    var altBoxX = width - altBoxW - 4;
    var altBoxY = 18;
    var altBoxH = height - 44;

    ctx.save();
    ctx.beginPath();
    ctx.rect(altBoxX, altBoxY, altBoxW, altBoxH);
    ctx.clip();
    
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(altBoxX, altBoxY, altBoxW, altBoxH);

    var pixelsPerMeter = 16;
    var currentAlt = Number(window.lastTelemetry?.alt) || 0;
    
    for (var m = Math.floor(currentAlt - 4); m <= Math.ceil(currentAlt + 4); m += 1) {
        var yPosAlt = cy + (currentAlt - m) * pixelsPerMeter;
        if (yPosAlt < altBoxY || yPosAlt > altBoxY + altBoxH) continue;

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(altBoxX, yPosAlt);
        ctx.lineTo(altBoxX + 6, yPosAlt);
        ctx.stroke();

        ctx.font = "9px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "right";
        ctx.fillText(m.toFixed(0), altBoxX + altBoxW - 4, yPosAlt + 3);
    }
    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(altBoxX, altBoxY, altBoxW, altBoxH);

    // Pointer Tengah Altitude
    ctx.fillStyle = "#ff9800";
    ctx.beginPath();
    ctx.moveTo(altBoxX, cy);
    ctx.lineTo(altBoxX - 5, cy - 4);
    ctx.lineTo(altBoxX - 5, cy + 4);
    ctx.fill();

    // Box Nilai Tengah Altitude
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(altBoxX, cy - 8, altBoxW, 16);
    ctx.strokeStyle = "#ff9800";
    ctx.strokeRect(altBoxX, cy - 8, altBoxW, 16);
    
    ctx.font = "bold 9px sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.fillText(currentAlt.toFixed(1) + "m", altBoxX + (altBoxW / 2), cy + 3);

    // =========================================================================
    // 4. STATUS ARMED / DISARMED DI ATAS TENGAH GYRO
    // =========================================================================
    const isArmed = !!(window.lastTelemetry?.is_armed || window.parent?.gcsState?.armed);
    ctx.font = "bold 11px sans-serif";
    ctx.fillStyle = isArmed ? "#4caf50" : "#f44336";
    ctx.textAlign = "center";
    ctx.shadowColor = "black";
    ctx.shadowBlur = 3;
    ctx.fillText(isArmed ? "ARMED" : "DISARMED", cx, 14);

    ctx.restore();
}

window.updateTelemetryUI = function(data) {
    if (!data) return;
    window.lastTelemetry = Object.assign(window.lastTelemetry || {}, data);

    if (data.lat !== undefined && data.lon !== undefined) {
        const lat = Number(data.lat), lon = Number(data.lon), alt = Number(data.alt) || 0;
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
            updateMap({ lat, lon, alt, heading: data.heading, speed: data.speed });
        }
        const coordsEl = document.getElementById('coords');
        if (coordsEl) coordsEl.innerText = (Number.isFinite(lat) ? lat.toFixed(8) : '0.00000') + ', ' + (Number.isFinite(lon) ? lon.toFixed(8) : '0.00000');
        const altEl = document.getElementById('altitude');
        if (altEl) altEl.innerText = alt.toFixed(1) + ' m';
    }

    if (data.speed !== undefined) {
        const speedEl = document.getElementById('speed');
        if (speedEl) speedEl.innerText = data.speed.toFixed(1) + ' m/s';
    }
    if (data.climb !== undefined) {
        const climbEl = document.getElementById('climb');
        if (climbEl) climbEl.innerText = data.climb.toFixed(1) + ' m/s';
    }

    if (data.roll !== undefined && data.pitch !== undefined) {
        const rollEl = document.getElementById('roll');
        const pitchEl = document.getElementById('pitch');
        const yawEl = document.getElementById('yaw');
        if (rollEl) rollEl.innerText = data.roll.toFixed(2) + '°';
        if (pitchEl) pitchEl.innerText = data.pitch.toFixed(2) + '°';
        let heading360 = ((data.yaw || 0) % 360 + 360) % 360;
        if (yawEl) yawEl.innerText = heading360.toFixed(2) + '°';
        
        drawArtificialHorizon(data.roll, data.pitch, data.yaw || 0);
    }

    if(data.rangefinder_distance !== undefined) {
        const distance = data.rangefinder_distance || 0;
        const isHealthy = !!data.rangefinder_healthy;
        const sensorType = data.rangefinder_type || 'UNKNOWN';

        const rfDistEl = document.getElementById('rangefinderDistance');
        const rfDetailEl = document.getElementById('rangefinderDetail');

        if (rfDistEl) {
            rfDistEl.innerText = isHealthy ? distance.toFixed(2) + ' m' : '-- m';
            if (!isHealthy) rfDistEl.style.color = '#888';
            else if (distance < 1.0) rfDistEl.style.color = '#f44336';
            else if (distance < 3.0) rfDistEl.style.color = '#ff9800';
            else rfDistEl.style.color = '#05b1ef';
        }
        if (rfDetailEl) rfDetailEl.innerText = isHealthy ? sensorType : sensorType + ' (out of range)';
    }

    if (data.gps_fix_type !== undefined || data.satellites_visible !== undefined) {
        const fixType = data.gps_fix_type || 0;
        let fixText = 'No Fix', fixColor = '#f44336';
        if (fixType === 1) { fixText = '2D Fix'; fixColor = '#ff9800'; }
        else if (fixType >= 2) { fixText = '3D Fix'; fixColor = '#4caf50'; }

        const gpsIndicator = document.getElementById('gpsIndicator');
        const gpsFixEl = document.getElementById('gpsFix');
        const gpsSatsEl = document.getElementById('gpsSats');
        
        if (gpsIndicator) gpsIndicator.style.background = fixColor;
        if (gpsFixEl) gpsFixEl.innerText = fixText;
        if (gpsSatsEl) gpsSatsEl.innerText = (data.satellites_visible || 0) + ' satellites';
    }

    // if (data.flight_mode !== undefined) {
    //     const flightModeEl = document.getElementById('flightModeLabel');
    //     if (flightModeEl) flightModeEl.innerText = data.flight_mode;
    // }

    if (data.flight_mode !== undefined && data.flight_mode !== "UNKNOWN") {
        const flightModeEl = document.getElementById('flightModeLabel');
        if (flightModeEl) {
            if(flightModeEl.innerText !== data.flight_mode) {
                flightModeEl.innerText = data.flight_mode;
            }
        }
    }
    
    if (data.vehicle_type !== undefined && data.vehicle_type !== 'UNKNOWN') {
        window._stableVehicleType = data.vehicle_type; 
    }
    
    let rc5 = data.rc5_in !== undefined ? data.rc5_in : (window.lastTelemetry ? window.lastTelemetry.rc5_in : 0);
    if (rc5 >= 1400) {
        window._stableVehicleType = 'COPTER';
    } else if (rc5 > 800 && rc5 < 1300) {
        window._stableVehicleType = 'ROVER';
    }
    
    let displayType = window._stableVehicleType || 'ROVER';
    if (rc5 > 800) { 
        displayType = (rc5 > 1700 || rc5 < 1200) ? 'ROVER' : 'COPTER';
    }
    window.currentVehicleType = displayType;

    const vehicleTypeEl = document.getElementById('vehicleType');
    if (vehicleTypeEl) {
        vehicleTypeEl.innerText = window.currentVehicleType;
        vehicleTypeEl.style.color = (window.currentVehicleType === 'COPTER') ? '#2196f3' : '#ff9800';
    }

    if (data.throttle !== undefined) {
        const throttleGridEl = document.getElementById('throttleGridValue');
        if (throttleGridEl) throttleGridEl.innerText = Math.round(data.throttle) + '%';
    }

    // Pengecekan ketat tipe data boolean untuk memastikan status ARMED hanya berubah saat benar-benar arm
    if (data.is_armed !== undefined && typeof data.is_armed === 'boolean') {
        const isArmed = data.is_armed;
        const armGridEl = document.getElementById('armGridStatus');
        if (armGridEl) {
            armGridEl.innerText = isArmed ? 'ARMED' : 'DISARMED';
            armGridEl.style.color = isArmed ? '#4caf50' : '#f44336';
        }

        const armToggleBtn = document.getElementById('armToggleBtn');
        if (armToggleBtn) {
            armToggleBtn.innerText = isArmed ? 'ARMED' : 'DISARMED';
            armToggleBtn.classList.toggle('btn-arm', isArmed);
            armToggleBtn.classList.toggle('btn-disarm', !isArmed);
        }

        if (window.parent && window.parent.gcsState) {
            window.parent.gcsState.armed = isArmed;
        }
    }

    if (data.safety_off !== undefined) {
        // console.log("[HUD] Menerima data safety dari FC:", data.safety_off);
        if (!window.parent.gcsState) window.parent.gcsState = {};
        if (!window.parent.gcsState.safety) window.parent.gcsState.safety = {};
        
        // Jika status fisik di drone berbeda dengan state di GCS, perbarui GCS-nya
        if (window.parent.gcsState.safety.off !== data.safety_off) {
            window.parent.gcsState.safety.off = data.safety_off;
            updateSafetyButton(); // Update teks/warna tombol di tab Actions
        }
    }
    updateSafetyHUDIndicator();
}

    const safeOverlay = document.getElementById('horizonSafeOverlay');
    const safetyOff = !!window.parent.gcsState?.safety?.off;

    if (safeOverlay) {

    }
}

function switchTelemPage(pageId, btnElement) {
    document.querySelectorAll('.telem-page').forEach(p => p.style.display = 'none');

function logLocalFeedback(text, severity = 6) {
    if (window.parent?.gcsConnection?.addLog) {
        window.parent.gcsConnection.addLog(text, severity, 'GCS');
    }
    const logContent = document.getElementById('mavlinkLogContent');
    if (!logContent) return;
    if (logContent.innerHTML.includes('Menunggu pesan')) logContent.innerHTML = '';

    const timeStr = new Date().toTimeString().split(' ')[0];
    const safeText = String(text).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const msgDiv = document.createElement('div');
    msgDiv.className = `log-sev-${severity}`;
    msgDiv.style.marginBottom = "3px";
    msgDiv.innerHTML = `<span style="color:#ffff;">[${timeStr}]</span> ${safeText}`;

    logContent.appendChild(msgDiv);
    if (logContent.childElementCount > 200) logContent.removeChild(logContent.firstChild);
    logContent.scrollTop = logContent.scrollHeight;
}

function logAckResult(actionLabel, ack) {
    if (!ack) {
        logLocalFeedback(`${actionLabel}: perintah terkirim (tanpa ACK)`, 6);
        return;
    }
    if (ack.ok) {
        logLocalFeedback(`${actionLabel}`, 6);
    } else if (ack.result === 'timeout') {
        logLocalFeedback(`${actionLabel}`, 4);
    } else {
        logLocalFeedback(`${actionLabel}`, 3);
    }
}

async function toggleArm() {
    if (!window.parent.commands) return alert("Sistem command belum termuat.");
    const isLive = window.parent.commands._radioActive() || window.parent.commands._udpActive();
    if (!isLive) return alert("Gagal: Tidak ada koneksi aktif ke Drone.");

    const btn = document.getElementById('armToggleBtn');
    if (btn) btn.disabled = true;

    try {
        const currentArmed = !!window.parent.gcsState?.armed;
        const targetArmed = !currentArmed;
        const ack = await window.parent.commands.armDisarm(targetArmed);
        if (ack && ack.ok) updateArmButton();
        logAckResult(targetArmed ? 'ARM' : 'DISARM', ack);
    } catch (e) {
        alert(`Gagal mengubah ARM State: ${e.message}`);
    } finally {
        if (btn) btn.disabled = false;
    }
}

async function doAction(action) {
    if (!window.parent.commands) return alert("Sistem command belum termuat.");
    const isLive = window.parent.commands._radioActive() || window.parent.commands._udpActive();
    if (!isLive) return alert("Gagal: Tidak ada koneksi aktif ke Drone.");

    const link = window.parent.commands._getActiveLink();

    try {
        switch(action) {
            case 'arm': {
                const ack = await window.parent.commands.armDisarm(true);
                logAckResult('ARM', ack);
                break;
            }
            case 'disarm': {
                const ack = await window.parent.commands.armDisarm(false);
                logAckResult('DISARM', ack);
                break;
            }
            case 'reboot': {
                if (confirm("Yakin ingin melakukan Reboot pada Flight Controller?")) {
                    const ack = await window.parent.commands.reboot();
                    logAckResult('REBOOT FC', ack);
                }
                break;
            }
            case 'takeoff': {
                const ack = await link.takeoff(2);
                logAckResult('TAKEOFF', ack);
                break;
            }
            case 'rover': {
                const telem = window.parent?.gcsConnection?.telemetry?.data || window.lastTelemetry || {};
                const currentAlt = Number(telem.alt || telem.altitude || 0);
                if (currentAlt > 0.5) {
                    alert(`Gagal: Drone masih berada di udara (altitude ${currentAlt.toFixed(2)} m). Harap mendarat dahulu.`);
                    return;
                }
                await window.parent.commands.setHybridMode('rover');
                window.currentVehicleType = 'ROVER';
                const vEl = document.getElementById('vehicleType');
                if (vEl) { vEl.innerText = 'ROVER'; vEl.style.color = '#ff9800'; }
                if (droneMarker) updateMap(window.lastTelemetry || {});
                logLocalFeedback('[TRANSITION] Mode ROVER aktif (Darat)', 6);
                break;
            }
            case 'copter': {
                logLocalFeedback('[TRANSITION] Switching to Copter mode...', 6);
                await window.parent.commands.setHybridMode('copter_safe');
                await new Promise(resolve => setTimeout(resolve, 1500));
                await window.parent.commands.setHybridMode('ready');
                window.currentVehicleType = 'COPTER';
                const vEl = document.getElementById('vehicleType');
                if (vEl) { vEl.innerText = 'COPTER'; vEl.style.color = '#2196f3'; }
                if (droneMarker) updateMap(window.lastTelemetry || {});
                logLocalFeedback('[TRANSITION] Mode COPTER ready', 6);
                break;
            }
            case 'rtl': {
                const ack = await link.rtl();
                logAckResult('RTL', ack);
                break;
            }
            case 'land': {
                const ack = await link.land();
                logAckResult('LAND', ack);
                break;
            }
            case 'setmode': {
                const modeValue = document.getElementById('flightModeSelect').value;
                const modeLabel = document.getElementById('flightModeSelect').selectedOptions[0]?.text ?? modeValue;
                const ack = await window.parent.commands.setFlightMode(parseInt(modeValue, 10));
                logAckResult(`${modeLabel}`, ack);
                break;
            }
        }
    } catch (e) {
        logLocalFeedback(`❌ Gagal mengirim perintah ${action}: ${e.message}`, 3);
        alert(`Gagal mengirim perintah ${action}: ${e.message}`);
    }
}

// ===== FUNGSI TERBANG KE WAYPOINT (JUMP TO WP) =====
async function doJumpWaypoint() {
    if (!window.parent.commands) return alert("Sistem command belum termuat.");
    const isLive = window.parent.commands._radioActive() || window.parent.commands._udpActive();
    if (!isLive) return alert("Gagal: Tidak ada koneksi aktif ke Drone.");

    const wpInput = document.getElementById('targetWaypointInput');
    const seq = parseInt(wpInput?.value, 10);
    
    if (isNaN(seq) || seq < 0) {
        return alert("Nomor waypoint tidak valid.");
    }

    try {
        let ack = null;

        // Cek apakah fungsi lompat waypoint tersedia langsung di objek commands utama
        if (typeof window.parent.commands.setMissionCurrent === 'function') {
            ack = await window.parent.commands.setMissionCurrent(seq);
        } else {
            // Menggunakan command MAVLink standard (Command ID 46 / MAV_CMD_MISSION_START)
            const link = window.parent.commands._getActiveLink();
            if (link && typeof link.sendCommandLong === 'function') {
                // Parameter 1 (p1): nomor urut waypoint tujuan (seq)
                ack = await link.sendCommandLong(46, { p1: seq, p2: 0, p3: 0, p4: 0, p5: 0, p6: 0, p7: 0 });
            } else {
                throw new Error("Tidak ditemukan interface pengiriman perintah misi.");
            }
        }

        logAckResult(`JUMP TO WAYPOINT #${seq}`, ack);

        // Pastikan mode AUTO disegarkan agar drone langsung bernavigasi menuju waypoint tersebut
        const link = window.parent.commands._getActiveLink();
        if (link && typeof link.setFlightMode === 'function') {
            await link.setFlightMode(3); // 3 = AUTO
        }
    } catch (e) {
        console.error("[DEBUG Error] Gagal melompat ke waypoint:", e);
        logLocalFeedback(`Gagal melompat ke Waypoint #${seq}: ${e.message}`, 3);
        alert(`Gagal melompat ke Waypoint: ${e.message}`);
    }
}

// ===== SAR VICTIM DETECTION =====
let victimMarkers = [];
const VICTIM_BUFFER_RADIUS_METERS = 10;

function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
    const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function buildPopupHtml(lat, lon, opts = {}) {
    const { status = 'unknown', jumlah = 1, confidence = null, source = 'AI' } = opts;
    const isDead = status === 'D';
    const accentColor = isDead ? '#616161' : '#f44336';
    const detailLine = source === 'SAR' ? `Status: ${isDead ? 'Korban Tewas' : 'Korban Hidup'} &middot; Jumlah: ${jumlah} Orang` : `Keyakinan (AI): ${(confidence !== null ? confidence * 100 : 0).toFixed(1)}%`;

    return `
        <div style="text-align: center;">
            <b style="color:${accentColor}; font-size:12px;">🚨 KORBAN TERDETEKSI</b><br>
            <span style="font-size:11px; color:#666;">Radius: ${VICTIM_BUFFER_RADIUS_METERS}m</span><br><br>
            ${detailLine}<br>Lat: ${lat.toFixed(8)}<br>Lon: ${lon.toFixed(8)}<br><br>
            <button onclick="goToVictim(${lat}, ${lon})" style="background:#2196f3;color:white;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;">
                Terbang ke titik ini
            </button>
        </div>
    `;
}

function addVictimMarker(lat, lon, opts = {}) {
    const { status = 'unknown', jumlah = 1, confidence = null, source = 'AI' } = opts;
    const existing = victimMarkers.find(m => {
        const mLatLng = m.marker.getLatLng();
        return getDistanceMeters(lat, lon, mLatLng.lat, mLatLng.lng) < VICTIM_BUFFER_RADIUS_METERS;
    });

    if (existing) {
        if (existing.status !== status || existing.jumlah !== jumlah) {
            existing.status = status; existing.jumlah = jumlah;
            existing.marker.setPopupContent(buildPopupHtml(lat, lon, { status, jumlah, confidence, source }));
        }
        return existing.marker;
    }

    const isDead = status === 'D';
    const iconBg = isDead ? '33,33,33' : '244,67,54';
    const iconGlyph = isDead ? '📍' : '🆘';

    const bufferCircle = L.circle([lat, lon], {
        color: isDead ? '#424242' : 'red', fillColor: isDead ? '#424242' : '#f44336', fillOpacity: 0.15, radius: VICTIM_BUFFER_RADIUS_METERS, weight: 1, dashArray: '5, 5'
    }).addTo(map);

    const victimIcon = L.divIcon({
        html: `<div style="font-size: 18px; background: rgba(${iconBg}, 0.9); border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; color: white; border: 2px solid white; box-shadow: 0 0 10px ${isDead ? '#000' : 'red'};">${iconGlyph}</div>`,
        className: 'victim-icon', iconSize: [30, 30], iconAnchor: [15, 15]
    });

    const marker = L.marker([lat, lon], { icon: victimIcon, zIndexOffset: 1000 })
        .bindPopup(buildPopupHtml(lat, lon, { status, jumlah, confidence, source }))
        .addTo(map);

    marker.openPopup();
    victimMarkers.push({ marker, circle: bufferCircle, status, jumlah });
    return marker;
}

// ===== SAR STATUSTEXT PARSING =====
const SAR_PREFIX = "[SAR]";
const STATUSTEXT_MAX_LEN = 50;
const SAR_CHUNK_TIMEOUT_MS = 2000;
const sarChunkBuffers = new Map();

function flushSarBuffer(msgId) {
    const buf = sarChunkBuffers.get(msgId);
    if (!buf) return null;
    clearTimeout(buf.timeoutHandle);
    sarChunkBuffers.delete(msgId);
    return buf.text;
}

function reassembleSarText(logItem) {
    const text = String(logItem.text);
    const msgId = logItem.msgId ?? 0;
    const chunkSeq = logItem.chunkSeq ?? 0;

    if (!msgId) {
        return text.startsWith(SAR_PREFIX) ? { status: 'complete', text } : { status: 'not_sar' };
    }

    let buf = sarChunkBuffers.get(msgId);
    if (chunkSeq === 0) {
        if (!text.startsWith(SAR_PREFIX)) return { status: 'not_sar' };
        if (buf) clearTimeout(buf.timeoutHandle);
        buf = { text: '', lastSeq: -1 };
        sarChunkBuffers.set(msgId, buf);
    }
    if (!buf) return { status: 'not_sar' };

    buf.text += text;
    buf.lastSeq = chunkSeq;
    clearTimeout(buf.timeoutHandle);

    if (text.length >= STATUSTEXT_MAX_LEN) {
        buf.timeoutHandle = setTimeout(() => flushSarBuffer(msgId), SAR_CHUNK_TIMEOUT_MS);
        return { status: 'pending' };
    }
    return { status: 'complete', text: flushSarBuffer(msgId) };
}

function parseSarStatustext(fullText) {
    const data = fullText.trim().split(";");
    if (data.length !== 5) return null;
    const [, status, jumlahStr, latStr, lonStr] = data;
    const jumlah = parseInt(jumlahStr, 10);
    const lat = parseFloat(latStr);
    const lon = parseFloat(lonStr);
    if (!Number.isFinite(jumlah) || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    return { status, jumlah, lat, lon };
}

// ===== HUD ERROR NOTIFICATION HANDLER =====
function showHudError(text, severity) {
    if (severity > 5) return; 

    const container = document.getElementById('hudErrorContainer');
    if (!container) return;

    if (container.children.length >= 3) {
        container.removeChild(container.firstChild);
    }

    const banner = document.createElement('div');
    banner.className = `hud-error-banner ${severity >= 4 ? 'severity-warning' : ''}`;
    const severityLabel = severity <= 2 ? 'CRITICAL' : (severity === 3 ? 'ERROR' : 'WARNING');
    
    banner.innerHTML = `
        <span><b>[${severityLabel}]</b> ${text}</span>
        <span style="cursor: pointer; font-size: 14px; margin-left: 10px;" onclick="this.parentElement.remove()">&times;</span>
    `;

    container.appendChild(banner);

    setTimeout(() => {
        if (banner && banner.parentElement) {
            banner.style.opacity = '0';
            banner.style.transition = 'opacity 0.5s ease';
            setTimeout(() => banner.remove(), 500);
        }
    }, 6000);
}

window.updateMavlogUI = function(logItem) {
    showHudError(logItem.text, logItem.severity ?? 6);

    const sarResult = reassembleSarText(logItem);
    if (sarResult.status === 'pending') return; 
    if (sarResult.status === 'complete') {
        const parsed = parseSarStatustext(sarResult.text);
        if (parsed) {
            addVictimMarker(parsed.lat, parsed.lon, { status: parsed.status, jumlah: parsed.jumlah, source: 'SAR' });
        }
        return;
    }

    const logContent = document.getElementById('mavlinkLogContent');
    if (!logContent) return;

    if (logContent.innerHTML.includes('Menunggu pesan')) logContent.innerHTML = '';
    
    const safeText = String(logItem.text).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const timeStr = (typeof logItem.server_time === 'number')
        ? new Date(logItem.server_time * 1000).toTimeString().split(' ')[0]
        : new Date().toTimeString().split(' ')[0];
    
    const msgDiv = document.createElement('div');
    msgDiv.className = `log-sev-${logItem.severity ?? 6}`;
    msgDiv.style.marginBottom = "3px";
    msgDiv.innerHTML = `<span style="color:#ffff;">[${timeStr}]</span> ${safeText}`;
    
    logContent.appendChild(msgDiv);
    if (logContent.childElementCount > 200) logContent.removeChild(logContent.firstChild);
    logContent.scrollTop = logContent.scrollHeight;
};

(function replayLogHistory() {
    try {
        const parentConn = window.parent && window.parent.gcsConnection;
        if (parentConn && Array.isArray(parentConn.logHistory)) {
            parentConn.logHistory.forEach(logItem => window.updateMavlogUI(logItem));
        } 
    } catch (err) {
        console.error("[LOG] replaying log history:", err);
    }
})();

let headingLineBlack = null;
let headingLineYellow = null;
let isAutoCenterEnabled = true;

// KODE BARU: Fungsi untuk Toggle Auto-Center
window.toggleAutoCenter = function() {
    isAutoCenterEnabled = !isAutoCenterEnabled;
    const btn = document.getElementById('autoCenterBtn');
    if (btn) {
        btn.classList.toggle('active', isAutoCenterEnabled);
        btn.setAttribute('aria-pressed', String(isAutoCenterEnabled));
    }
    
    // Jika diaktifkan kembali, langsung paksakan kamera ke posisi drone saat ini
    if (isAutoCenterEnabled && droneMarker) {
        const currentPos = droneMarker.getLatLng();
        map.setView(currentPos, map.getZoom());
    }
};

function updateMap(data) {
    const lat = Number(data.lat), lon = Number(data.lon);

    if (!Number.isFinite(lat) || !Number.isFinite(lon) || (Math.abs(lat) < 0.000001 && Math.abs(lon) < 0.000001)) {
        if (droneMarker) { map.removeLayer(droneMarker); droneMarker = null; }
        if (headingLineBlack) { map.removeLayer(headingLineBlack); headingLineBlack = null; }
        if (headingLineYellow) { map.removeLayer(headingLineYellow); headingLineYellow = null; }
        return;
    }

    const rawHeading = Number.isFinite(data.heading) ? data.heading : (Number.isFinite(data.yaw) ? data.yaw : 0);
    const heading = ((rawHeading % 360) + 360) % 360;
    const vType = window.currentVehicleType || 'COPTER';
    const markerImage = (vType === 'ROVER') ? './static/images/rover.png' : './static/images/dronehijau.png';
    const markerHtml = `<img src="${markerImage}" style="width: 36px; height: 36px; transform: rotate(${heading}deg); object-fit: contain; border-radius: 5px;">`;

    if (!droneMarker) {
        const droneIcon = L.divIcon({ html: markerHtml, iconSize: [36, 36], iconAnchor: [18, 18], className: 'drone-icon-custom' });
        droneMarker = L.marker([lat, lon], { icon: droneIcon, zIndexOffset: 500, title: 'Vehicle Position' })
            .bindPopup(`<b>Vehicle</b><br>Lat: ${lat.toFixed(8)}<br>Lon: ${lon.toFixed(8)}<br>Alt: ${(Number(data.alt)||0).toFixed(1)}m<br>Heading: ${heading.toFixed(0)}°<br>Speed: ${(Number(data.speed)||0).toFixed(1)} m/s`)
            .addTo(map);
    } else {
        droneMarker.setLatLng([lat, lon]);
        const icon = droneMarker.getIcon();
        icon.options.html = markerHtml; 
        droneMarker.setIcon(icon);
    }

    const lineLengthMeters = 300; 
    const latRad = lat * Math.PI / 180;
    const headingRad = heading * Math.PI / 180;
    const lat2 = lat + (lineLengthMeters * Math.cos(headingRad)) / 111320;
    const lon2 = lon + (lineLengthMeters * Math.sin(headingRad)) / (111320 * Math.cos(latRad));
    const lineCoords = [[lat, lon], [lat2, lon2]];

    if (!headingLineBlack) {
        headingLineBlack = L.polyline(lineCoords, { color: 'black', weight: 6, opacity: 0.8 }).addTo(map);
        headingLineYellow = L.polyline(lineCoords, { color: '#ff9800', weight: 2, opacity: 1.0 }).addTo(map);
    } else {
        headingLineBlack.setLatLngs(lineCoords);
        headingLineYellow.setLatLngs(lineCoords);
    }
    if (isAutoCenterEnabled) {
        map.setView([lat, lon], map.getZoom());
    }
}

// ===== VIDEO STREAMING (WebRTC) =====
let pc = null;
window.openVideo = async function() {
    const modal = document.getElementById('videoModal');
    const statusText = document.getElementById('webrtc-status');
    const videoElement = document.getElementById('webrtc-video');

    modal.style.display = 'block';
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    updateCameraButtonState(true);

    const streamType = (localStorage.getItem('videoStreamType') || 'webrtc').toLowerCase();
    const streamUrl = localStorage.getItem('videoStreamUrl') || localStorage.getItem('raspyUrl') || 'http://10.205.208.136:5000';

    statusText.innerText = `Connecting (${streamType.toUpperCase()})...`;
    statusText.style.color = '#00bcd4';

    // JIKA BUKAN WEBRTC (Misal: MJPEG / HTTP Stream biasa)
    if (streamType === 'mjpeg' || streamType === 'flask_http' || streamUrl.includes('/video_feed')) {
        videoElement.style.display = 'none';
        imgElement.style.display = 'block';
        imgElement.onload = () => { statusText.innerText = `Video Live (${streamType.toUpperCase()})`; statusText.style.color = '#4caf50'; };
        imgElement.onerror = () => { statusText.innerText = `Gagal memuat ${streamType.toUpperCase()}`; statusText.style.color = '#f44336'; };

        let targetUrl = streamUrl;
        if (targetUrl.startsWith('udp://')) {
            const host = targetUrl.replace('udp://', '').split(':')[0] || '127.0.0.1';
            targetUrl = `http://${host}:5001/video_feed`;
        }
        imgElement.src = targetUrl + (targetUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
        return;
    }

    // JIKA MODE WEBRTC (Jalankan Signaling POST ke /webrtc/offer)
    videoElement.style.display = 'block';
    imgElement.style.display = 'none';
    videoElement.muted = true; videoElement.autoplay = true; videoElement.playsInline = true;

    try {
        let apiBase = localStorage.getItem('raspyUrl') || 'http://127.0.0.1:5000';
        console.log("[WebRTC] Using API Base URL:", apiBase);

        const config = {
            sdpSemantics: 'unified-plan',
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require',
        };
        pc = new RTCPeerConnection(config);
        pc.addEventListener('iceconnectionstatechange', () => console.log("[WebRTC] ICE iceConnection State:", pc.iceConnectionState));
        pc.addEventListener('connectionstatechange', () => console.log("[WebRTC] Connection State:", pc.connectionState));
        pc.addEventListener('track', (evt) => console.log('[WebRTC] track diterima! kind:', evt.track.kind, '| jumlah streams:', evt.streams.length));
        pc.addEventListener('icecandidate', (event) => {
            if (event.candidate) {
                console.log('[WebRTC] Local ICE candidate:', event.candidate.candidate);
            }
        });

        let inboundStream = null;

        pc.addEventListener('track', function(evt) {
            if (evt.track.kind === 'video') {
                if (evt.streams && evt.streams[0]) {
                    videoElement.srcObject = evt.streams[0];
                } else {
                    if (!inboundStream) inboundStream = new MediaStream();
                    inboundStream.addTrack(evt.track);
                    videoElement.srcObject = inboundStream;
                }
                const playPromise = videoElement.play()
                if (playPromise !== undefined){
                    playPromise.catch(err => {
                        if(err.name !== 'AbortError') {
                            console.error("[WebRTC] Error playing video:", err);
                        }
                    });
                    
                }

            }
        });

        pc.addTransceiver('video', { direction: 'recvonly' });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise((resolve) => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                function checkState() {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                }
                pc.addEventListener('icegatheringstatechange', checkState);
                // setTimeout(resolve, 5000); 
            }
        });

        console.log("[WebRTC] ICE gathering complete, sending offer...");

        const response = await fetch(apiBase + '/webrtc/offer', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
            },
            body: JSON.stringify({
                sdp: pc.localDescription.sdp,
                type: pc.localDescription.type
            })
        });

        const answer = await response.json();

        if (!response.ok || answer.status === 'failed' || answer.status === 'error') {
            throw new Error(answer.message || `HTTP Error ${response.status}`);
        }

        await pc.setRemoteDescription(answer);
        statusText.innerText = 'Video Connected - Live (WebRTC)';
        statusText.style.color = '#4caf50'; 

    } catch (err) {
        statusText.innerText = 'Connection Failed: ' + err.message;
        statusText.style.color = '#f44336';
        alert("webRTC Connection Error: " + err.message);
    }
}

window.closeVideo = function() {
    document.getElementById('videoModal').style.display = 'none';
    const videoElement = document.getElementById('webrtc-video');
    if (videoElement.srcObject) {
        videoElement.srcObject.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
    }
    if (pc) { pc.close(); pc = null; }
}


// ===== GOTO VICTIM =====
async function goToVictim(lat, lon, alt = null) {
    if (!window.parent.commands) return alert("Command bridge not loaded.");
    const link = window.parent.commands._getActiveLink();
    if (!link) return alert("No active link to drone.");
    
    const t = window.lastTelemetry || {};
    const isArmed = t.is_armed || (t.arm_mode === 'armed') || false;
    const currentMode = t.flight_mode || 'UNKNOWN';
    const targetAlt = (alt !== null && !Number.isNaN(alt)) ? alt : (Number(t.altitude) || 0);

    if (isArmed && currentMode === 'AUTO') {
        if (!confirm(`Drone sedang ARMED (AUTO). Pindah ke GUIDED untuk interupsi misi ke korban (${lat.toFixed(5)}, ${lon.toFixed(5)})?`)) return;
    }

    const result = await link.sendCommandLong(192, { p1: -1, p2: 0, p3: 0, p4: NaN, p5: lat, p6: lon, p7: targetAlt });
    if (!result.ok) alert(`Gagal reposition: ${result.result}`);
}
