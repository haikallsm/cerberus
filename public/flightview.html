<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight View - HAWKEYE</title>
<link rel="stylesheet" href="./static/css/leaflet.css"/> 
<link rel="stylesheet" href="./static/css/gcs.css"/>
<link rel="stylesheet" href="./static/css/flightview.css"/>
</head>

<body style="background: transparent;">

<div class="main" style="margin-left: 0;">
    <div id="map"></div>

    <div class="telemetry-panel">
        <div class="ah-container">
            <canvas id="gyroCanvas" width="200" height="100"></canvas>
            <div class="ah-overlay">
                <div class="ah-bank-scale" id="bankScale"></div>
                <div class="ah-crosshair"></div>
            </div>
        </div>

        <div id="page-telems" class="telem-page" style="display: block">

            <div class="telem-tabs" style="margin-bottom: 8px;">
                <button class="telem-tab-btn active" onclick="switchTelemPage('telems', this)">Quick</button>
                <button class="telem-tab-btn" onclick="switchTelemPage('actions', this)">Actions</button>
            </div>

            <div class="telemetry-grid">
                <div class="telemetry-item">
                    <div class="telemetry-label">Altitude</div>
                    <div id="altitude" class="telemetry-value">0 m</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Roll</div>
                    <div id="roll" class="telemetry-value">0°</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Pitch</div>
                    <div id="pitch" class="telemetry-value">0°</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Lat / Lon</div>
                    <div id="coords" class="telemetry-value" style="font-size: 10px;">0.00000, 0.00000</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Speed</div>
                    <div id="speed" class="telemetry-value">0 m/s</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Climb Rate</div>
                    <div id="climb" class="telemetry-value">0 m/s</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Flight Mode</div>
                    <div id="flightModeLabel" class="telemetry-value">UNKNOWN</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Throttle</div>
                    <div id="throttleGridValue" class="telemetry-value">0%</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Heading</div>
                    <div id="yaw" class="telemetry-value">0°</div>
                </div>
                <div class="telemetry-item">
                    <div class="telemetry-label">Armed</div>
                    <div id="armGridStatus" class="telemetry-value">DISARMED</div>
                </div>
                
                <div class="telemetry-item">
                    <div class="telemetry-label">Vehicle Type</div>
                    <div id="vehicleType" class="telemetry-value">UNKNOWN</div>
                </div>
    
                <div class="telemetry-item" id="rangefinderItem">
                    <div class="telemetry-label">RangeFinder</div>
                    <div id="rangefinderDistance" class="telemetry-value">-- m</div>
                    <div id="rangefinderDetail" class="telemetry-detail">UNKNOWN</div>
                </div>
            </div>
    
            <!-- GPS Status -->
            <div style="margin-top: 6px; padding: 6px; background: #0a0a1a; border-radius: 2px; border-left: 3px solid #2196f3;">
                <div style="font-size: 10px; color: #888; margin-bottom: 4px;">GPS</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div id="gpsIndicator" style="width: 8px; height: 8px; border-radius: 50%; background: #f44336;"></div>
                    <div style="flex: 1;">
                        <div id="gpsFix" style="font-size: 10px; color: #ccc;">No Fix</div>
                        <div id="gpsSats" style="font-size: 9px; color: #888;">0 satellites</div>
                    </div>
                </div>
            </div>
    
            <div style="border-top: 1px solid #444; margin-top: 8px; padding-top: 8px; font-size: 9px; color: #888;">
                <div> <span id="msgCount">0</span> msgs</div>
                <div> <span id="errorCount">0</span> errors</div>
            </div>
        </div>

        <!-- PAGE 2: ACTIONS (Tombol Perintah) -->
        <div id="page-actions" class="telem-page" style="display: none; padding-top: 10px;">
            
            <div class="telem-tabs" style="margin-bottom: 8px;">
                <button class="telem-tab-btn active" onclick="switchTelemPage('telems', this)">Quick</button>
                <button class="telem-tab-btn" onclick="switchTelemPage('actions', this)">Actions</button>
            </div>

            <div class="action-grid">
                <button class="action-btn btn-arm" onclick="doAction('arm')">ARM</button>
                <button class="action-btn btn-disarm" onclick="doAction('disarm')">DISARM</button>
                <button class="action-btn" onclick="doAction('takeoff')">TAKEOFF</button>
                
                <button class="action-btn btn-warning" onclick="doAction('safety_off')">SAFETY OFF</button>
                <button class="action-btn btn-disarm" onclick="doAction('safety_on')">SAFETY ON</button>
                <button class="action-btn" onclick="doAction('land')">LAND</button>
                
                <button class="action-btn btn-danger" onclick="doAction('reboot')">REBOOT</button>
                <button class="action-btn btn-rover" onclick="doAction('rover')">ROVER</button>
                <button class="action-btn btn-copter" onclick="doAction('copter')">COPTER</button>
                <button class="action-btn btn-rtl" onclick="doAction('rtl')">RTL</button>
            </div>

            <div class="action-section-title" style="margin-top: 12px;">Flight Modes</div>
            <div style="display: flex; gap: 8px;">
                <select id="flightModeSelect" class="action-select">
                    <option value="0">STABILIZE</option>
                    <option value="2">ALT_HOLD</option>
                    <option value="3">AUTO</option>
                    <option value="4">GUIDED</option>
                    <option value="5">LOITER</option>
                </select>
                <button class="action-btn" onclick="doAction('setmode')" style="width: 80px;">SET</button>
            </div>
        </div>
    </div>

    <div id="mavlinkLogPanel" class="mavlink-log-panel">
        <div style="font-size: 10px; color: #00bcd4; padding-bottom: 6px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;"></div>
        <div id="mavlinkLogContent"></div>
    </div>

</div>

<!-- VIDEO POPUP -->
<div id="videoModal" class="video-modal">
    <div class="video-content">
        <span class="close-btn" onclick="closeVideo()">&times;</span>
        <video id="webrtc-video" playsinline muted autoplay></video>
        <div id="webrtc-status" class="webrtc-status">Connecting...</div>
    </div>
</div>

<script src="./static/js/leaflet.js"></script>
<script>
// ===== MAP =====
let map = L.map('map', { zoomControl: true, attributionControl: true }).setView([-7.25, 112.75], 13);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri',
    maxZoom: 19
}).addTo(map);

setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());

let lastLogTime = null;
let droneMarker = null;

// ===== ARTIFICIAL HORIZON =====
const gyroCanvas = document.getElementById('gyroCanvas');
const gyroCtx = gyroCanvas.getContext('2d');

function resizeCanvas() {
    const parent = gyroCanvas.parentElement;
    if (gyroCanvas.width !== parent.clientWidth || gyroCanvas.height !== parent.clientHeight) {
        gyroCanvas.width = parent.clientWidth;
        gyroCanvas.height = parent.clientHeight;
    }
}

function DrawEllipse(ctx, color, linewidth, x, y, width, height) {
    ctx.lineWidth = linewidth; ctx.strokeStyle = color; ctx.beginPath();
    ctx.arc(x + width/2, y + height/2, width/2, 0, 2 * Math.PI); ctx.stroke();
}
function DrawLine(ctx, color, width, x1, y1, x2, y2) {
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function DrawPolygon(ctx, color, width, list) {
    ctx.lineWidth = width; ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(list[0], list[1]);
    for (let i = 2; i < list.length; i += 2) ctx.lineTo(list[i], list[i+1]);
    ctx.closePath(); ctx.fill();
}
function drawstring(ctx, string, font, fontsize, color, x, y) {
    ctx.font = "bold " + fontsize + "px " + font; ctx.fillStyle = color;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(string, x, y);
}

function drawArtificialHorizon(rollDeg, pitchDeg, yawDeg) {
    if (!isFinite(rollDeg)) rollDeg = 0;
    if (!isFinite(pitchDeg)) pitchDeg = 0;
    if (!isFinite(yawDeg)) yawDeg = 0;

    resizeCanvas();
    const deg2rad = Math.PI / 180;
    const canvas = gyroCanvas, ctx = gyroCtx;
    
    // TAMBAHKAN BARIS INI: Hentikan rendering bila ukuran kanvas 0 (saat tab disembunyikan)
    if (canvas.width === 0 || canvas.height === 0) return; 
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(rollDeg * deg2rad);

    const font = "Arial";
    const fontsize = Math.max(9, canvas.height / 18);
    const halfwidth = canvas.width / 2, halfheight = canvas.height / 2;
    const every5deg = -canvas.height / 60;
    const pitchoffset = -pitchDeg * every5deg;

    const gradObj = ctx.createLinearGradient(0, -halfheight * 2, 0, halfheight * 2);
    gradObj.addColorStop(0.0, "#1976d2"); 
    let offset = Math.max(0, Math.min(1, 0.5 + pitchoffset / canvas.height / 2));
    gradObj.addColorStop(offset, "#64b5f6");
    gradObj.addColorStop(offset, "#8bc34a"); 
    gradObj.addColorStop(1.0, "#33691e");

    ctx.fillStyle = gradObj;
    ctx.fillRect(-halfwidth * 2, -halfheight * 2, halfwidth * 4, halfheight * 4);

    const lengthshort = canvas.width / 15, lengthlong = canvas.width / 10;
    for (let a = -90; a <= 90; a += 5) {
        if (a >= pitchDeg - 34 && a <= pitchDeg + 25) { 
            let yPos = pitchoffset + a * every5deg;
            if (a % 10 == 0) {
                DrawLine(ctx, "White", 2, -lengthlong, yPos, lengthlong, yPos);
                if (a !== 0) {
                    drawstring(ctx, a, font, fontsize + 1, "White", -lengthlong - 15, yPos);
                    drawstring(ctx, a, font, fontsize + 1, "White", lengthlong + 15, yPos);
                }
            } else {
                DrawLine(ctx, "White", 1, -lengthshort, yPos, lengthshort, yPos);
            }
        }
    }

    const extra = canvas.height / 15 * 4.9, llex = canvas.height / 66 + 2;
    DrawPolygon(ctx, "RED", 1, [0, -llex*2 - extra, -llex, -llex - extra, llex, -llex - extra]);
    for (let a = -60; a <= 60; a += 15) {
        ctx.restore(); ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(a * deg2rad);
        drawstring(ctx, Math.abs(a), font, fontsize, "White", 0, -llex * 8 - extra + 12);
        DrawLine(ctx, "White", 2, 0, -llex * 3 - extra, 0, -llex * 3 - extra - llex);
    }

    ctx.restore(); ctx.save();

    DrawEllipse(ctx, "red", 2, halfwidth - 10, halfheight - 10, 20, 20);
    DrawLine(ctx, "red", 2, halfwidth - 25, halfheight, halfwidth - 10, halfheight);
    DrawLine(ctx, "red", 2, halfwidth + 10, halfheight, halfwidth + 25, halfheight);
    DrawLine(ctx, "red", 2, halfwidth, halfheight - 10, halfwidth, halfheight - 25);

    const tapeHeight = 22, topY = canvas.height - tapeHeight, centerY = canvas.height - (tapeHeight / 2);
    ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
    ctx.fillRect(0, topY, canvas.width, tapeHeight);
    DrawLine(ctx, "white", 2, 0, topY, canvas.width, topY);

    const space = (canvas.width - 10) / 120.0, start = Math.round(yawDeg - 60);
    for (let a = start; a <= yawDeg + 60; a += 1) {
        let xPos = 5 + space * (a - start);
        if (a % 15 == 0) {
            DrawLine(ctx, "white", 2, xPos, canvas.height, xPos, topY + 2);
            let disp = ((a % 360) + 360) % 360;
            let label = disp;
            if(disp===0) label="N"; else if(disp===45) label="NE"; else if(disp===90) label="E"; else if(disp===135) label="SE";
            else if(disp===180) label="S"; else if(disp===225) label="SW"; else if(disp===270) label="W"; else if(disp===315) label="NW";
            drawstring(ctx, label, font, fontsize + 1, "white", xPos, centerY + 1);
        } else if (a % 5 == 0) {
            DrawLine(ctx, "white", 1, xPos, canvas.height, xPos, canvas.height - 6);
        }
        if (a === Math.round(yawDeg)) {
            DrawLine(ctx, "red", 2, xPos, canvas.height, xPos, topY);
        }
    }
}
drawArtificialHorizon(0, 0, 0);

// ===== MAIN TELEMETRY HANDLER =====
window.updateTelemetryUI = function(data) {
    if (!data) return;

    window.lastTelemetry = Object.assign(window.lastTelemetry || {}, data);

    if (data.lat !== undefined && data.lon !== undefined) {
        const lat = Number(data.lat), lon = Number(data.lon), alt = Number(data.alt) || 0;
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
            updateMap({ lat, lon, alt, heading: data.heading, speed: data.speed });
        }
        const coordsEl = document.getElementById('coords');
        if (coordsEl) coordsEl.innerText = (Number.isFinite(lat) ? lat.toFixed(5) : '0.00000') + ', ' + (Number.isFinite(lon) ? lon.toFixed(5) : '0.00000');
        const altEl = document.getElementById('altitude');
        if (altEl) altEl.innerText = alt.toFixed(1) + ' m';
    }

    if (data.speed !== undefined) {
        const speedEl = document.getElementById('speed');
        if(speedEl) speedEl.innerText = data.speed.toFixed(1) + ' m/s';
    }
    if (data.climb !== undefined) {
        const climbEl = document.getElementById('climb');
        if(climbEl) climbEl.innerText = data.climb.toFixed(1) + ' m/s';
    }

    if (data.roll !== undefined && data.pitch !== undefined) {
        const rollEl = document.getElementById('roll');
        const pitchEl = document.getElementById('pitch');
        const yawEl = document.getElementById('yaw');
        if (rollEl) rollEl.innerText = data.roll.toFixed(2) + '°';
        if (pitchEl) pitchEl.innerText = data.pitch.toFixed(2) + '°';
        if (yawEl) yawEl.innerText = (data.yaw || 0).toFixed(2) + '°';
        
        drawArtificialHorizon(data.roll, data.pitch, data.yaw || 0);
    }

    if (data.battery_voltage !== undefined || data.battery_remaining !== undefined) {
        const battVoltage = data.battery_voltage || 0;
        const battCurrent = data.battery_current || 0;
        const battPercent = data.battery_remaining >= 0 ? data.battery_remaining : 0;

        const battVoltEl = document.getElementById('batteryVoltage');
        const battDetailEl = document.getElementById('batteryStatusDetail');

        if (battVoltEl) {
            battVoltEl.innerText = battVoltage.toFixed(1) + ' V';
            if (battPercent < 20) battVoltEl.style.color = '#f44336'; 
            else if (battPercent < 40) battVoltEl.style.color = '#ff9800'; 
            else battVoltEl.style.color = '#05b1ef'; 
        }
        if (battDetailEl) battDetailEl.innerText = battCurrent.toFixed(1) + ' A / ' + battPercent + '%';
    }

    if(data.rangefinder_distance !== undefined) {
        const distance = data.rangefinder_distance || 0;
        const isHealthy = !!data.rangefinder_healthy;
        const sensorType = data.rangefinder_type || 'UNKNOWN';

        const rfDistEl = document.getElementById('rangefinderDistance');
        const rfDetailEl = document.getElementById('rangefinderDetail');

        if (rfDistEl) {
            rfDistEl.innerText = isHealthy ? distance.toFixed(2) + ' m' : '-- m';
            if (!isHealthy) rfDistEl.style.color = '#888';
            else if (distance < 1.0) rfDistEl.style.color = '#f44336';
            else if (distance < 3.0) rfDistEl.style.color = '#ff9800';
            else rfDistEl.style.color = '#05b1ef';
        }
        if (rfDetailEl) rfDetailEl.innerText = isHealthy ? sensorType : sensorType + ' (out of range)';
    }

    if (data.gps_fix_type !== undefined || data.satellites_visible !== undefined) {
        const fixType = data.gps_fix_type || 0;
        let fixText = 'No Fix', fixColor = '#f44336';
        if (fixType === 1) { fixText = '2D Fix'; fixColor = '#ff9800'; }
        else if (fixType >= 2) { fixText = '3D Fix'; fixColor = '#4caf50'; }

        const gpsIndicator = document.getElementById('gpsIndicator');
        const gpsFixEl = document.getElementById('gpsFix');
        const gpsSatsEl = document.getElementById('gpsSats');
        
        if (gpsIndicator) gpsIndicator.style.background = fixColor;
        if (gpsFixEl) gpsFixEl.innerText = fixText;
        if (gpsSatsEl) gpsSatsEl.innerText = (data.satellites_visible || 0) + ' satellites';
    }

    if (data.flight_mode !== undefined) {
        const flightModeEl = document.getElementById('flightModeLabel');
        if (flightModeEl) flightModeEl.innerText = data.flight_mode;
    }

    if (data.vehicle_type !== undefined && data.vehicle_type !== 'UNKNOWN') {
        window._stableVehicleType = data.vehicle_type; 
    }
    
    let rc5 = data.rc5_in !== undefined ? data.rc5_in : (window.lastTelemetry ? window.lastTelemetry.rc5_in : 0);
    
    let displayType = window._stableVehicleType;
    
    if (rc5 > 800) { 
        if (rc5 > 1700 || rc5 < 1200) {
            displayType = 'ROVER';
        } else {
            displayType = 'COPTER';
        }
    }

    const vehicleTypeEl = document.getElementById('vehicleType');
    if (vehicleTypeEl) {
        vehicleTypeEl.innerText = displayType;

        if (displayType === 'COPTER') {
            vehicleTypeEl.style.color = '#2196f3';
        } else if (displayType === 'ROVER') {
            vehicleTypeEl.style.color = '#ff9800';
        } else {
            vehicleTypeEl.style.color = '#ffff';
        }
    }

    if (data.throttle !== undefined) {
        const throttleGridEl = document.getElementById('throttleGridValue');
        if (throttleGridEl) throttleGridEl.innerText = Math.round(data.throttle) + '%';
    }

    if (data.arm_mode !== undefined || data.is_armed !== undefined) {
        const isArmed = data.is_armed || (data.arm_mode === 'armed') || false;
        const armGridEl = document.getElementById('armGridStatus');
        if (armGridEl) {
            armGridEl.innerText = isArmed ? 'ARMED' : 'DISARMED';
            armGridEl.style.color = isArmed ? '#4caf50' : '#f44336';
        }
    }
}

// ===== TELEMETRY TABS & ACTIONS LOGIC =====
function switchTelemPage(pageId, btnElement) {
    document.querySelectorAll('.telem-page').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.telem-tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById('page-' + pageId).style.display = 'block';
    btnElement.classList.add('active');
}

function logLocalFeedback(text, severity = 6) {
    const logContent = document.getElementById('mavlinkLogContent');
    if (!logContent) return;
    if (logContent.innerHTML.includes('Menunggu pesan')) logContent.innerHTML = '';

    const timeStr = new Date().toTimeString().split(' ')[0];
    const safeText = String(text).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const msgDiv = document.createElement('div');
    msgDiv.className = `log-sev-${severity}`;
    msgDiv.style.marginBottom = "3px";
    msgDiv.innerHTML = `<span style="color:#747d8c;">[${timeStr}]</span> ${safeText}`;

    logContent.appendChild(msgDiv);
    if (logContent.childElementCount > 200) logContent.removeChild(logContent.firstChild);
    logContent.scrollTop = logContent.scrollHeight;
}

const MAV_RESULT_MAP = {
    0: 'ACCEPTED', 1: 'TEMPORARILY_REJECTED', 2: 'DENIED',
    3: 'UNSUPPORTED', 4: 'FAILED', 5: 'IN_PROGRESS', 6: 'CANCELLED',
};

function logAckResult(actionLabel, ack) {
    if (!ack) {
        logLocalFeedback(`${actionLabel}: perintah terkirim (tanpa ACK)`, 6);
        return;
    }
    if (ack.ok) {
        logLocalFeedback(`${actionLabel}`, 6);
    } else if (ack.result === 'timeout') {
        logLocalFeedback(`${actionLabel}`, 4);
    } else {
        const resultName = MAV_RESULT_MAP[ack.result] ?? ack.result;
        logLocalFeedback(`${actionLabel}`, 3);
    }
}

async function doAction(action) {
    if (!window.parent.commands) {
        alert("Sistem command belum termuat.");
        return;
    }
    
    const isLive = window.parent.commands._radioActive() || window.parent.commands._udpActive();
    if (!isLive) {
        alert("Gagal: Tidak ada koneksi aktif ke Drone.");
        return;
    }

    const link = window.parent.commands._getActiveLink();

    try {
        switch(action) {
            case 'arm': {
                const ack = await window.parent.commands.armDisarm(true);
                logAckResult('ARM', ack);
                break;
            }
            case 'disarm': {
                const ack = await window.parent.commands.armDisarm(false);
                logAckResult('DISARM', ack);
                break;
            }
            case 'safety_on': {
                const ack = await window.parent.commands.setSafetySwitch(true);
                logAckResult('SAFETY SWITCH ON', ack);
                console.log("Safety Switch ON (SAFE)");
                break;
            }
            case 'safety_off': {
                const ack = await window.parent.commands.setSafetySwitch(false);
                logAckResult('SAFETY SWITCH OFF', ack);
                console.log("Safety Switch OFF (LIVE)");
                break;
            }
            case 'reboot': {
                if (confirm("Yakin ingin melakukan Reboot pada Flight Controller?")) {
                    const ack = await window.parent.commands.reboot();
                    logAckResult('REBOOT FC', ack);
                }
                break;
            }
            case 'takeoff': {
                const ack = await link.takeoff(2);
                logAckResult('TAKEOFF', ack);
                break;
            }
            case 'rover': {
                const telem = window.parent.gcsConnection.telemetry;
                const bataslanding = 0.5;
                const currentAlt = telem.alt || 0;
                if (currentAlt > bataslanding) {
                    alert(`Gagal: Drone masih berada di udara (altitude ${currentAlt.toFixed(2)} m). Silakan mendaratkan drone terlebih dahulu sebelum beralih ke mode ROVER.`);
                    return;
                }
                await window.parent.commands.setHybridMode('rover');
                logLocalFeedback('[TRANSITION] Rover mode ready', 6);
                console.log("[TRANSITION] Switching to Rover mode (ready)...");
                break;
            }
            case 'copter': {
                console.log("[TRANSITION] Switching to Copter mode (safety)...");
                await window.parent.commands.setHybridMode('copter_safe');
                logLocalFeedback('[TRANSITION] Switching to Copter mode', 6);
                await new Promise(resolve => setTimeout(resolve, 2000));
                console.log("[TRANSITION] Switching to Copter mode (ready)...");
                await window.parent.commands.setHybridMode('ready');
                logLocalFeedback('[TRANSITION] Copter mode ready', 6);
                break;
            }
            case 'rtl': {
                const ack = await link.rtl();
                logAckResult('RTL', ack);
                break;
            }
            case 'land': {
                const ack = await link.land();
                logAckResult('LAND', ack);
                break;
            }
            case 'setmode': {
                const modeValue = document.getElementById('flightModeSelect').value;
                const modeLabel = document.getElementById('flightModeSelect').selectedOptions[0]?.text ?? modeValue;
                const ack = await window.parent.commands.setFlightMode(parseInt(modeValue, 10));
                logAckResult(`${modeLabel}`, ack);
                break;
            }
        }
    } catch (e) {
        logLocalFeedback(`❌ Gagal mengirim perintah ${action}: ${e.message}`, 3);
        alert(`Gagal mengirim perintah ${action}: ${e.message}`);
    }
}

let victimMarkers = [];
const VICTIM_BUFFER_RADIUS_METERS = 10;

function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
    const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function buildPopupHtml(lat, lon, opts = {}) {
    const { status = 'unknown', jumlah = 1, confidence = null, source = 'AI' } = opts;
    const isDead = status === 'D';
    const accentColor = isDead ? '#616161' : '#f44336';

    const detailLine = source === 'SAR'
        ? `Status: ${isDead ? 'Korban Tewas' : 'Korban Hidup'} &middot; Jumlah: ${jumlah} Orang<br>Sumber: Laporan FCU (STATUSTEXT)`
        : `Keyakinan (AI): ${(confidence !== null ? confidence * 100 : 0).toFixed(1)}%`;

    return `
        <div style="text-align: center;">
            <b style="color:${accentColor}; font-size:12px;">🚨 KORBAN TERDETEKSI</b><br>
            <span style="font-size:11px; color:#666;">Radius: ${VICTIM_BUFFER_RADIUS_METERS}m</span><br><br>
            ${detailLine}<br>
            Lat: ${lat.toFixed(7)}<br>Lon: ${lon.toFixed(7)}<br><br>
            <button onclick="goToVictim(${lat}, ${lon})"
                style="background:#2196f3;color:white;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:12px;">
                Terbang ke titik ini
            </button>
        </div>
    `;
}

function addVictimMarker(lat, lon, opts = {}) {
    const { status = 'unknown', jumlah = 1, confidence = null, source = 'AI' } = opts;

    const existing = victimMarkers.find(m => {
        const mLatLng = m.marker.getLatLng();
        return getDistanceMeters(lat, lon, mLatLng.lat, mLatLng.lng) < VICTIM_BUFFER_RADIUS_METERS;
    });

    if (existing) {
        if (existing.status !== status || existing.jumlah !== jumlah) {
            existing.status = status;
            existing.jumlah = jumlah;
            existing.marker.setPopupContent(buildPopupHtml(lat, lon, { status, jumlah, confidence, source }));
        }
        return existing.marker;
    }

    const isDead = status === 'D';
    const iconBg = isDead ? '33,33,33' : '244,67,54';
    const iconGlyph = isDead ? '📍' : '🆘';

    const bufferCircle = L.circle([lat, lon], {
        color: isDead ? '#424242' : 'red',
        fillColor: isDead ? '#424242' : '#f44336',
        fillOpacity: 0.15,
        radius: VICTIM_BUFFER_RADIUS_METERS,
        weight: 1,
        dashArray: '5, 5'
    }).addTo(map);

    const victimIcon = L.divIcon({
        html: `<div style="font-size: 18px; background: rgba(${iconBg}, 0.9); border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; color: white; border: 2px solid white; box-shadow: 0 0 10px ${isDead ? '#000' : 'red'}; font-family: Arial;">${iconGlyph}</div>`,
        className: 'victim-icon',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
    });

    const marker = L.marker([lat, lon], { icon: victimIcon, zIndexOffset: 1000 })
        .bindPopup(buildPopupHtml(lat, lon, { status, jumlah, confidence, source }))
        .addTo(map);

    marker.openPopup();
    victimMarkers.push({ marker, circle: bufferCircle, status, jumlah });

    const logContent = document.getElementById('mavlinkLogContent');
    if (logContent) {
        const timeStr = new Date().toTimeString().split(' ')[0];
        const msgDiv = document.createElement('div');
        msgDiv.style.marginBottom = "3px";
        msgDiv.innerHTML = `<span style="color:#f44336; font-weight:bold;">[${timeStr}] 🎯 SAR ALERT (${source}): ${isDead ? 'Korban Tewas' : 'Korban Hidup'} dikunci pada ${lat.toFixed(5)}, ${lon.toFixed(5)}</span>`;
        logContent.appendChild(msgDiv);
        logContent.scrollTop = logContent.scrollHeight;
    }

    return marker;
}

function removeVictimMarkers() {
    victimMarkers.forEach(v => {
        map.removeLayer(v.marker);
        map.removeLayer(v.circle);
    });
    victimMarkers = victimMarkers.filter(m => m !== markerEntry);
} 

// ===== SAR STATUSTEXT PARSING (chunk-aware) =====
const SAR_PREFIX = "[SAR]";
const STATUSTEXT_MAX_LEN = 50;
const SAR_CHUNK_TIMEOUT_MS = 2000; // flush paksa kalau chunk lanjutan tak kunjung datang (buang buffer basi)
const sarChunkBuffers = new Map(); // msgId -> { text, lastSeq, timeoutHandle }

function flushSarBuffer(msgId) {
    const buf = sarChunkBuffers.get(msgId);
    if (!buf) return null;
    clearTimeout(buf.timeoutHandle);
    sarChunkBuffers.delete(msgId);
    return buf.text;
}

function reassembleSarText(logItem) {
    const text = String(logItem.text);
    const msgId = logItem.msgId ?? 0;
    const chunkSeq = logItem.chunkSeq ?? 0;

    if (!msgId) {
        return text.startsWith(SAR_PREFIX) ? { status: 'complete', text } : { status: 'not_sar' };
    }

    // Kasus multi-chunk
    let buf = sarChunkBuffers.get(msgId);
    if (chunkSeq === 0) {
        if (!text.startsWith(SAR_PREFIX)) return { status: 'not_sar' }; // chunked tapi bukan pesan SAR, lewat sbg log biasa
        if (buf) clearTimeout(buf.timeoutHandle);
        buf = { text: '', lastSeq: -1 };
        sarChunkBuffers.set(msgId, buf);
    }
    if (!buf) return { status: 'not_sar' }; // chunk_seq > 0 tanpa chunk awal yg tercatat -> out-of-order, abaikan

    buf.text += text;
    buf.lastSeq = chunkSeq;
    clearTimeout(buf.timeoutHandle);

    if (text.length >= STATUSTEXT_MAX_LEN) {
        // Chunk ini penuh -> kemungkinan besar masih ada lanjutan, tunggu
        buf.timeoutHandle = setTimeout(() => flushSarBuffer(msgId), SAR_CHUNK_TIMEOUT_MS);
        return { status: 'pending' };
    }
    return { status: 'complete', text: flushSarBuffer(msgId) };
}

function parseSarStatustext(fullText) {
    const data = fullText.trim().split(";");
    if (data.length !== 5) {
        console.warn("[SAR] Format tidak valid, field count:", data.length, fullText);
        return null;
    }
    const [, status, jumlahStr, latStr, lonStr] = data;
    const jumlah = parseInt(jumlahStr, 10);
    const lat = parseFloat(latStr);
    const lon = parseFloat(lonStr);

    if (!Number.isFinite(jumlah) || !Number.isFinite(lat) || !Number.isFinite(lon)) {
        console.warn("[SAR] Gagal parse numerik:", fullText);
        return null;
    }
    if (status !== 'H' && status !== 'D') {
        console.warn("[SAR] Status tidak dikenal:", status);
        return {status, jumlah, lat, lon};
    }
    return { status, jumlah, lat, lon };
}

window.updateMavlogUI = function(logItem) {
    console.log("[LOG] Received:", logItem.text);

    // --- Intersepsi [SAR] SEBELUM ditampilkan sebagai log FCU biasa ---
    const sarResult = reassembleSarText(logItem);
    if (sarResult.status === 'pending') return; // masih menunggu chunk lanjutan, jangan render apa pun dulu
    if (sarResult.status === 'complete') {
        const parsed = parseSarStatustext(sarResult.text);
        if (parsed) {
            addVictimMarker(parsed.lat, parsed.lon, { status: parsed.status, jumlah: parsed.jumlah, source: 'SAR' });
        }
        return;
    }

    const logContent = document.getElementById('mavlinkLogContent');
    if (!logContent) return;

    if (logContent.innerHTML.includes('Menunggu pesan')) logContent.innerHTML = '';
    
    const safeText = String(logItem.text).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const timeStr = (typeof logItem.server_time === 'number')
    ? new Date(logItem.server_time * 1000).toTimeString().split(' ')[0]
    : new Date().toTimeString().split(' ')[0];
    
    const msgDiv = document.createElement('div');
    msgDiv.className = `log-sev-${logItem.severity ?? 6}`;
    msgDiv.style.marginBottom = "3px";
    msgDiv.innerHTML = `<span style="color:#747d8c;">[${timeStr}]</span> ${safeText}`;
    
    logContent.appendChild(msgDiv);
    
    if (logContent.childElementCount > 200) logContent.removeChild(logContent.firstChild);
    logContent.scrollTop = logContent.scrollHeight;
};

(function replayLogHistory() {
    try {
        const parentConn = window.parent && window.parent.gcsConnection;
        if (parentConn && Array.isArray(parentConn.logHistory)) {
            parentConn.logHistory.forEach(logItem => window.updateMavlogUI(logItem));
        } 
    } catch (err) {
        console.error("[LOG] replaying log history:", err);
    }
})();

// ===== UPDATE MAP MARKER =====
let headingLineBlack = null;
let headingLineYellow = null;

function updateMap(data) {
    const lat = Number(data.lat), lon = Number(data.lon);

    if (!Number.isFinite(lat) || !Number.isFinite(lon) || (Math.abs(lat) < 0.000001 && Math.abs(lon) < 0.000001)) {
        if (droneMarker) { map.removeLayer(droneMarker); droneMarker = null; }
        if (headingLineBlack) { map.removeLayer(headingLineBlack); headingLineBlack = null; }
        if (headingLineYellow) { map.removeLayer(headingLineYellow); headingLineYellow = null; }
        return;
    }

    const heading = Number.isFinite(data.heading) ? data.heading : 0;
    
    if (!droneMarker) {
        const droneIcon = L.divIcon({
            html: `<div class="drone-marker" style="transform: rotate(${heading}deg);"></div>`,
            iconSize: [36, 36], iconAnchor: [18, 18], className: 'drone-icon'
        });
        droneMarker = L.marker([lat, lon], { icon: droneIcon, zIndexOffset: 500, title: 'Drone Position' })
            .bindPopup(`<b>Drone</b><br>Lat: ${lat.toFixed(6)}<br>Lon: ${lon.toFixed(6)}<br>Alt: ${(Number(data.alt)||0).toFixed(1)}m<br>Heading: ${heading.toFixed(0)}°<br>Speed: ${(Number(data.speed)||0).toFixed(1)} m/s`)
            .addTo(map);
    } else {
        droneMarker.setLatLng([lat, lon]);
        const icon = droneMarker.getIcon();
        icon.options.html = `<div class="drone-marker" style="transform: rotate(${heading}deg);"></div>`;
        droneMarker.setIcon(icon);
    }

    const lineLengthMeters = 300; // Panjang garis simulasi (dalam meter)
    const latRad = lat * Math.PI / 180;
    const headingRad = heading * Math.PI / 180;
    const lat2 = lat + (lineLengthMeters * Math.cos(headingRad)) / 111320;
    const lon2 = lon + (lineLengthMeters * Math.sin(headingRad)) / (111320 * Math.cos(latRad));
    const lineCoords = [[lat, lon], [lat2, lon2]];

    if (!headingLineBlack) {
        headingLineBlack = L.polyline(lineCoords, { color: 'black', weight: 6, opacity: 0.8 }).addTo(map);
        headingLineYellow = L.polyline(lineCoords, { color: '#ff9800', weight: 2, opacity: 1.0 }).addTo(map);
    } else {
        headingLineBlack.setLatLngs(lineCoords);
        headingLineYellow.setLatLngs(lineCoords);
    }
    map.setView([lat, lon], map.getZoom());
}

// ===== DRAG PANEL =====
const panel = document.querySelector('.telemetry-panel');
let isDragging = false, offsetX, offsetY, headerPanelGap = 0;

panel.addEventListener('mousedown', e => {
     const tag = e.target.tagName.toLowerCase();
    if (tag === 'select' || tag === 'button' || tag === 'input' || tag === 'textarea') {
        return;
    }
    isDragging = true;
    offsetX = e.clientX - panel.offsetLeft;
    offsetY = e.clientY - panel.offsetTop;
});
document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    panel.style.left = (e.clientX - offsetX) + 'px';
    panel.style.top = (e.clientY - offsetY) + 'px';
    panel.style.right = 'auto';
});

document.addEventListener('mouseup', () => isDragging = false);

// ===== VIDEO STREAMING (WebRTC) =====
let pc = null;
window.openVideo = async function() {
    const modal = document.getElementById('videoModal');
    const statusText = document.getElementById('webrtc-status');
    const videoElement = document.getElementById('webrtc-video');

    modal.style.display = 'block';
    statusText.innerText = 'Connecting Video...';
    statusText.style.color = '#00bcd4';

    try {
        let apiBase = localStorage.getItem('raspyUrl') || 'http://127.0.0.1:5000';
        console.log("[WebRTC] Using API Base URL:", apiBase);

        const config = {
            sdpSemantics: 'unified-plan',
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require',
        };
        pc = new RTCPeerConnection(config);
        pc.addEventListener('iceconnectionstatechange', () => console.log("[WebRTC] ICE iceConnection State:", pc.iceConnectionState));
        pc.addEventListener('connectionstatechange', () => console.log("[WebRTC] Connection State:", pc.connectionState));
        pc.addEventListener('track', (evt) => console.log('[WebRTC] track diterima! kind:', evt.track.kind, '| jumlah streams:', evt.streams.length));
        pc.addEventListener('icecandidate', (event) => {
            if (event.candidate) {
                console.log('[WebRTC] Local ICE candidate:', event.candidate.candidate);
            }
        });

        let inboundStream = null;

        pc.addEventListener('track', function(evt) {
            if (evt.track.kind === 'video') {
                if (evt.streams && evt.streams[0]) {
                    videoElement.srcObject = evt.streams[0];
                } else {
                    if (!inboundStream) inboundStream = new MediaStream();
                    inboundStream.addTrack(evt.track);
                    videoElement.srcObject = inboundStream;
                }
                const playPromise = videoElement.play()
                if (playPromise !== undefined){
                    playPromise.catch(err => {
                        if(err.name !== 'AbortError') {
                            console.error("[WebRTC] Error playing video:", err);
                        }
                    });
                    
                }

            }
        });

        pc.addTransceiver('video', { direction: 'recvonly' });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await new Promise((resolve) => {
            if (pc.iceGatheringState === 'complete') resolve();
            else {
                function checkState() {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                }
                pc.addEventListener('icegatheringstatechange', checkState);
                // setTimeout(resolve, 5000); 
            }
        });

        console.log("[WebRTC] ICE gathering complete, sending offer...");

        const response = await fetch(apiBase + '/webrtc/offer', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
            },
            body: JSON.stringify({
                sdp: pc.localDescription.sdp,
                type: pc.localDescription.type
            })
        });

        const answer = await response.json();

        if (!response.ok || answer.status === 'failed' || answer.status === 'error') {
            throw new Error(answer.message || `HTTP Error ${response.status}`);
        }

        await pc.setRemoteDescription(answer);
        statusText.innerText = 'Video Connected - Live (WebRTC)';
        statusText.style.color = '#4caf50'; 

    } catch (err) {
        statusText.innerText = 'Connection Failed: ' + err.message;
        statusText.style.color = '#f44336';
        alert("webRTC Connection Error: " + err.message);
    }
}

window.closeVideo = function() {
    document.getElementById('videoModal').style.display = 'none';
    const videoElement = document.getElementById('webrtc-video');
    if (videoElement.srcObject) {
        videoElement.srcObject.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
    }
    if (pc) { pc.close(); pc = null; }
}

// ===== SAR VICTIM DETECTION (computer-vision, via polling /video/detections) =====
async function pollVictimDetection() {
    try {
        // Ambil Base URL dari Parent Iframe
        const baseUrl = window.parent.gcsConnection?.baseUrl || 'http://localhost:5000';
        const response = await fetch(baseUrl + '/video/detections');
        if (!response.ok) throw new Error('HTTP error ' + response.status);

        const result = await response.json();

        if (result && result.objects) {
            result.objects.forEach(obj => {
                if (obj.class === 'person' && obj.confidence > 0.6) {
                    const vLat = result.lat;
                    const vLon = result.lon;

                    if (Math.abs(vLat) < 0.0001 && Math.abs(vLon) < 0.0001) return;

                    addVictimMarker(vLat, vLon, { status: 'unknown', confidence: obj.confidence, source: 'AI' });
                }
            });
        }
    } catch (e) {}
}

async function goToVictim(lat, lon, alt = null) {
    if (!window.parent.commands) {
        alert("Command bridge not loaded.");
        return;
    }
    const link = window.parent.commands._getActiveLink();
    if (!link) {
        alert("No active link to drone.");
        return;
    }
    const t = window.lastTelemetry || {};
    const isArmed = t.is_armed || (t.arm_mode === 'armed') || false;
    const currentMode = t.flight_mode || 'UNKNOWN';
    const targetAlt = (alt !== null && !Number.isNaN(alt)) ? alt : (Number(t.altitude) || 0);

    if (isArmed && currentMode === 'AUTO') {
        const confirmMsg = `Drone sedang ARMED dan menjalankan mission (AUTO).\n\n` +
            `Mengirim drone ke titik korban akan MEMINDAHKAN mode ke GUIDED dan ` +
            `menginterupsi mission saat ini (mission TIDAK dihapus, hanya di-pause).\n\n` +
            `Lat: ${lat.toFixed(7)}, Lon: ${lon.toFixed(7)}\n\n` +
            `Lanjutkan?`;
        if (!confirm(confirmMsg)) return;
    }

    const result = await link.sendCommandLong(192, {
        p1: -1,
        p2: 0,
        p3: 0,
        p4: NaN,
        p5: lat,
        p6: lon,
        p7: targetAlt,
    });

    if (result.ok) {
        console.log(`[SAR] Reposition ke korban dikirim: ${lat}, ${lon}, alt=${targetAlt}m`);
    } else {
        alert(`Gagal mengirim perintah reposition: ${result.result}`);
    }
}
