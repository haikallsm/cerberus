<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerberus</title>
    <link rel="stylesheet" href="./static/css/navbar.css">
    <link rel="stylesheet" href="./static/css/gcs.css">
    <script src="./static/js/socket.io.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #0a0a1a; }
        iframe { border: none; width: 100%; height: 100%; flex-grow: 1; }
    </style>
</head>
<body>

    <div id="paramLoadingBanner" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(10, 10, 26, 0.8); z-index:10000; justify-content:center; align-items:center; backdrop-filter: blur(3px);">
        <div style="background:#1a1a2e; border: 2px solid #ff9800; border-radius: 12px; padding: 30px 50px; display:flex; flex-direction:column; align-items:center; gap:20px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);">
            <div style="font-size: 32px; animation: spin 2s linear infinite;">⏳</div>
            <span id="paramLoadingText" style="color:#ff9800; font-weight: bold; font-size: 16px; letter-spacing: 0.5px;">Getting parameters from FC...</span>
        </div>
    </div>    
    
    <div id="navbar-placeholder"></div>

    <iframe id="main-frame" src="./flightview.html"></iframe>


    <script src="./static/js/mavlink_protocol.js"></script>
    <script src="./static/js/gcs.js"></script>
    <script src="./static/js/radio-mavlink.js"></script>
    <script src="./static/js/mavlink_udp.js"></script>
    <script src="./static/js/command.js?v=2"></script>
    <script>

        fetch('navbar.html?v=1')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                toggleConnType();
                updateNavbarStatus();
            })
            .catch(error => console.error('Gagal memuat navbar:', error));
        
        // 1. Inisialisasi Radio MAVLink
        window.radioMavlink = new RadioMavlink();
        window.radioMavlink.tryAutoReconnect().catch(() => {});

        window.udpMavlink = new UdpMavlink();

        window.mavFeatures = window.commands;

        let iframeReady = false;          
        const logQueue = [];

        function routeTelemetry(raw) {
            const adaptedData = window.adaptRadioTelemetry(raw);

            // Simpan ke "Otak Utama" (Global Store) agar tab Mission & Preflight tidak buta
            if (window.gcsConnection && window.gcsConnection.telemetry) {
                window.gcsConnection.telemetry.updateFromApi(adaptedData);
            }

            // Dorong ke Iframe UI yang sedang aktif (Flight View)
            const frame = document.getElementById('main-frame');
            if (frame?.contentWindow?.updateTelemetryUI) {
                frame.contentWindow.updateTelemetryUI(adaptedData);
            }
        }

        function routeMavlog(logItem) {
            if (!iframeReady) {
                logQueue.push(logItem);
                return;
            }
            const frame = document.getElementById('main-frame');
            if (frame?.contentWindow?.updateMavlogUI) {
                frame.contentWindow.updateMavlogUI(logItem);
            }
        }

        function handleLinkConnect() {
            updateNavbarStatus();
            setTimeout(loadAllParams, 2000);
        }
        function handleLinkDisconnect() {
            updateNavbarStatus();
            window.paramCache.loaded = false;
            window.paramCache.params = {};
        }

        document.addEventListener('DOMContentLoaded', function() {
            const frame = document.getElementById('main-frame');
            if (frame) {
                frame.addEventListener('load', function() {
                    iframeReady = true;
                    console.log('Iframe ready');
                    
                    // Kirim semua log yang tertunda setelah iframe siap
                    while (logQueue.length > 0) {
                        const queued = logQueue.shift();
                        if (frame.contentWindow && typeof frame.contentWindow.updateMavlogUI === 'function') {
                            frame.contentWindow.updateMavlogUI(queued);
                        }
                    }
                });
            }

            window.radioMavlink.onTelemetry = routeTelemetry;
            window.radioMavlink.onMavlog = routeMavlog;
            window.udpMavlink.onTelemetry = routeTelemetry;
            window.udpMavlink.onMavlog = routeMavlog;

        });

        window.paramCache = {
            params: {},
            loaded: false,
            loading: false,
            progress: { count: 0, total: null}
        };

        function showParamLoadingOverlay(show, count = 0, total = null) {
            const el = document.getElementById('paramLoadingBanner');

            if (typeof show === 'number') {
                total = count;
                count = show;
                show = true;
            }

            el.style.display = show ? 'flex' : 'none';
            if (show) {
                const totalStr = (total && total > 0) ? ` / ${total}` : '';
                document.getElementById('paramLoadingText').innerText = `Getting parameters from FC... (${count}${totalStr})`;
            }
        }

        async function loadAllParams() {
            if(window.paramCache.loading) return;
            window.paramCache.loading = true;
            window.paramCache.loaded = false;
            showParamLoadingOverlay(true, 0, null);

            try {
                const params = await window.commands.getAllParams((count, total) => {
                    window.paramCache.progress = { count, total };
                    showParamLoadingOverlay(count, total);
                });
                window.paramCache.params = params;
                window.paramCache.loaded = true;

                const frame = document.getElementById('main-frame');
                if (frame && frame.contentWindow) {
                    frame.contentWindow.dispatchEvent(new Event('paramCacheUpdated'));
                }
            } catch (err) {
                console.error('Gagal memuat parameter:', err);
                alert('Gagal memuat parameter: ' + err.message);
            } finally {
                window.paramCache.loading = false;
                showParamLoadingOverlay(false);
            }

        }

        function handleAccelCalPosRequest(posNumber) {
            window.acceptCalStep = posNumber;
            const frame = document.getElementById('main-frame');
            if (frame?.contentWindow?.onAccelCalPosPrompt) {
                frame.contentWindow.onAccelCalPosPrompt(posNumber);
            }
        }

        function handleAccelCalPosSignal(param1) {
            const frame = document.getElementById('main-frame');
            if (frame?.contentWindow?.onAccelCalPosSignal) {
                frame.contentWindow.onAccelCalPosSignal(param1);
            }
        }
        
        window.radioMavlink.onConnect = handleLinkConnect;
        window.radioMavlink.onDisconnect = handleLinkDisconnect;
        window.udpMavlink.onConnect = handleLinkConnect;
        window.udpMavlink.onDisconnect = handleLinkDisconnect;
        window.radioMavlink.onAccelCalPosRequest = handleAccelCalPosRequest;
        window.udpMavlink.onAccelCalPosRequest = handleAccelCalPosRequest;
        window.radioMavlink.onAccelCalPosSignal = handleAccelCalPosSignal;
        window.udpMavlink.onAccelCalPosSignal = handleAccelCalPosSignal;

        function navigateTo(url, el) {
            document.getElementById('main-frame').src = url;
            document.querySelectorAll('.nav-left a').forEach(a => a.classList.remove('active'));
            if(el) el.classList.add('active');
            const camBtn = document.getElementById('nav-camera');
            if (url === '/flightview.html') {
                camBtn.style.display = 'inline-block';
            } else {
                camBtn.style.display = 'none';
            }
        }

        function triggerCamera() {
            const frame = document.getElementById('main-frame');
            if (frame.contentWindow && typeof frame.contentWindow.openVideo === 'function') {
                frame.contentWindow.openVideo();
            }
        }

        function toggleConnType() {
           const type = document.getElementById('connTypeSelect').value;
            const serialGroup = document.getElementById('serialGroup');
            const ipGroup = document.getElementById('ipGroup');
            
            if (type === 'serial') {
                if (serialGroup) serialGroup.style.display = 'flex';
                if (ipGroup) ipGroup.style.display = 'none';
            } else {
                if (serialGroup) serialGroup.style.display = 'none';
                if (ipGroup) ipGroup.style.display = 'flex'; // Mengubah display menjadi flex agar muncul dan bisa diketik
            }
            updateNavbarStatus();
        }

        async function handleSelectRadioPort() {
            if (!window.radioMavlink) { alert('Modul radio-mavlink.js belum termuat.'); return; }
            const select = document.getElementById('portSelect');
            try {
                const ports = await window.radioMavlink.requestPort(); // sekarang return array {path, manufacturer, ...}
                if (!select) return;
                if (!ports || ports.length === 0) {
                    select.innerHTML = '<option value="">Tidak ada port terdeteksi</option>';
                    return;
                }
                select.innerHTML = ports.map(p =>
                    `<option value="${p.path}">${p.path}${p.manufacturer ? ' — ' + p.manufacturer : ''}</option>`
                ).join('');
            } catch (err) {
                console.error('Gagal scan port radio:', err);
                if (select) select.innerHTML = '<option value="">Gagal scan port</option>';
            }
        }

        async function connectRadio() {
            const statusEl = document.getElementById('statusText');
            const portSelect = document.getElementById('portSelect');
            const selectedPath = portSelect?.value;

            if (!window.radioMavlink || !selectedPath || selectedPath === 'Scanning ports...') {
                alert('Pilih port radio dulu (tombol "Scan").');
                return;
            }
            const baud = parseInt(document.getElementById('baudSelect').value, 10);
            statusEl.textContent = 'Connecting radio...';
            try {
                await window.radioMavlink.connect(baud, selectedPath);
            } catch (err) {
                alert('Gagal connect radio: ' + err.message);
            }
            updateNavbarStatus();
        }

        async function disconnectRadio() {
            if (window.radioMavlink) {
                await window.radioMavlink.disconnect();
            }
            updateNavbarStatus();
        }

        async function connectUdp() {
            const host = document.getElementById('ipHostInput').value.trim();
            const port = document.getElementById('ipPortInput').value.trim();
            const statusEl = document.getElementById('statusText');
            
            if (!host || !port) {
                alert('IP dan Port wajib diisi!');
                return;
            }

            statusEl.textContent = 'Connecting UDP...';
            try {
                await window.udpMavlink.connect(host, port);
            } catch (err) {
                alert('Gagal connect UDP: ' + err.message);
            }
            updateNavbarStatus();
        }

        async function disconnectUdp() {
            if (window.udpMavlink) {
                await window.udpMavlink.disconnect();
            }
            updateNavbarStatus();
        }

        async function handleMainConnect() {
            const type = document.getElementById('connTypeSelect').value;
            const isRadioConnected = !!(window.radioMavlink && window.radioMavlink.telemetry?.connected);
            const isUdpConnected = !!(window.udpMavlink && window.udpMavlink.telemetry?.connected);

            if (type === 'serial') {
                if (isUdpConnected) await disconnectUdp();
                if (isRadioConnected) {
                    await disconnectRadio();
                } else {
                    await connectRadio();
                }
            } else {
                if (isRadioConnected) await disconnectRadio();
                if (isUdpConnected) {
                    await disconnectUdp();
                } else {
                    await connectUdp();
                }
            }
            updateNavbarStatus();
        }

        function updateNavbarStatus() {
            const type = document.getElementById('connTypeSelect')?.value;
            const statusEl = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            if (!statusEl || !connectBtn) return;

            if (type === 'serial') {
                const connected = !!(window.radioMavlink && window.radioMavlink.telemetry?.connected);
                statusEl.textContent = connected ? 'Connected' : 'Disconnected';
                connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
            } else {
                const connected = !!(window.udpMavlink && window.udpMavlink.telemetry?.connected);
                statusEl.textContent = connected ? 'UDP Connected' : 'UDP Disconnected';
                connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
            }
        }

        setInterval(updateNavbarStatus, 5000);
    </script>
</body>
</html>
