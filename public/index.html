<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAWKEYE - GCS</title>
    <link rel="stylesheet" href="./static/css/index.css">
    <link rel="stylesheet" href="./static/css/navbar.css">
    <link rel="stylesheet" href="./static/css/gcs.css">
    <script src="./static/js/socket.io.min.js"></script>
</head>
<body>
    <div id="paramLoadingBanner" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(10, 10, 26, 0.8); z-index:10000; justify-content:center; align-items:center; backdrop-filter: blur(3px);">
        <div style="background:#1a1a2e; border: 2px solid #ff9800; border-radius: 12px; padding: 30px 50px; display:flex; flex-direction:column; align-items:center; gap:20px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);">
            <div style="font-size: 32px; animation: spin 2s linear infinite;">⏳</div>
            <span id="paramLoadingText" style="color:#ff9800; font-weight: bold; font-size: 16px; letter-spacing: 0.5px;">Getting parameters from FC...</span>
        </div>
    </div>    
    
    <div id="navbar-placeholder"></div>

    <!-- Multi-Iframe Container (Mencegah Refresh Total saat Pindah Menu) -->
    <div class="view-container">
        <iframe id="frame-flight" class="app-iframe active" src="./flightview.html"></iframe>
        <iframe id="frame-setup" class="app-iframe" src="./setup.html"></iframe>
        <iframe id="frame-mission" class="app-iframe" src="./mission.html"></iframe>
        <iframe id="frame-config" class="app-iframe" src="./config.html"></iframe>
    </div>

    <!-- <script src="./static/js/web-bridge.js"></script> -->
    <script src="./static/js/mavlink_protocol.js"></script>
    <script src="./static/js/gcs.js"></script>
    <script src="./static/js/radio-mavlink.js"></script>
    <script src="./static/js/mavlink_udp.js"></script>
    <script src="./static/js/command.js?v=2"></script>
    <script>

        fetch('navbar.html?v=1')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                toggleConnType();
                updateNavbarStatus();
            })
            .catch(error => console.error('Gagal memuat navbar:', error));
        
        // 1. Inisialisasi Radio MAVLink
        window.radioMavlink = new RadioMavlink();
        window.radioMavlink.tryAutoReconnect().catch(() => {});

        window.udpMavlink = new UdpMavlink();

        // Inisialisasi Koneksi Socket.IO untuk menjembatani python bridge (port 5002)
        // const bridgeSocket = io('http://127.0.0.1:5002');
        // bridgeSocket.on('mavlink-log', (logItem) => {
        //     // Tangkap langsung pesan log/SAR dari Python bridge dan teruskan ke router MAVLog GCS
        //     routeMavlog(logItem);
        // });

        window.mavFeatures = window.commands;
        window.gcsState = {safety: {off: false}, armed: false};
        window.gcsConnection.logHistory = [];
        window.gcsConnection.logSeq = 0;
        window.gcsConnection.addLog = function (
            text,
            severity = 6,
            source = 'GCS'
        ) {
            const logItem = {
                seq: ++window.gcsConnection.logSeq,
                text: String(text),
                severity,
                source,
                server_time: Date.now() / 1000
            };

            window.gcsConnection.logHistory.push(logItem);
            if (window.gcsConnection.logHistory.length > 500) {
                window.gcsConnection.logHistory.shift();
            }

            return logItem;
        };
        

        // =========================================================================
        // FRAME ORCHESTRATION (multi-iframe shell)
        //
        // Parent adalah single source of truth: telemetri, riwayat log, dan param
        // cache selalu diperbarui di sini. Hanya frame AKTIF yang menerima render
        // (updateTelemetryUI / updateMavlogUI). Frame lain tidur di sisi UI
        // (parent meng-set window.__gcsActive = false di dalamnya) dan
        // disinkronkan ulang lewat syncFrame() saat diaktifkan, sehingga tidak ada
        // data yang hilang saat pindah halaman — dan hidden frame tidak membuang
        // CPU untuk update kolom yang tidak terlihat.
        // =========================================================================

        // Pesan "penting" = severity <= WARNING skala MAV_SEVERITY, atau hasil deteksi SAR.
        const IMPORTANT_LOG_SEVERITY_MAX = 4;
        const SAR_LOG_MARKER = '[SAR]';

        let activeFrameId = 'frame-flight';
        const frameReady = {
            'frame-flight': false,
            'frame-setup': false,
            'frame-mission': false,
            'frame-config': false
        };

        // Salinan hasil adaptRadioTelemetry terakhir, dipakai syncFrame agar frame
        // yang baru diaktifkan menerima snapshot dalam bentuk yang identik dengan
        // alur live (telemetry.data di gcsConnection adalah master internal, bukan
        // bentuk untuk render).
        let lastAdaptedTelemetry = null;

        // Fungsi bantu untuk mendapatkan elemen iframe aktif saat ini
        function getActiveFrame() {
            return document.getElementById(activeFrameId);
        }

        // Panggil satu fungsi di window iframe aktif, tanpa error bila iframe
        // belum selesai dimuat atau fungsi belum didefinisikan.
        function deliverToActiveFrame(functionName, ...args) {
            const callback = getActiveFrame()?.contentWindow?.[functionName];
            if (typeof callback === 'function') callback(...args);
        }

        // Tandai window frame aktif/tidur; frame-fungsi polling internal (mission,
        // config) membaca flag ini agar berhenti membangunkan DOM saat hidden.
        function setFrameActiveFlag(frameId, isActive) {
            const frameWindow = document.getElementById(frameId)?.contentWindow;
            if (frameWindow) frameWindow.__gcsActive = isActive;
        }

        // Sinkronisasi penuh satu frame yang baru diaktifkan: snapshot telemetri,
        // replay log (delta dihitung di sisi frame berdasarkan seq), dan sinyal
        // param cache terbaru.
        function syncFrame(frameId) {
            const frameWindow = document.getElementById(frameId)?.contentWindow;
            if (typeof frameWindow?.applyParentState !== 'function') return;

            frameWindow.applyParentState({
                telemetry: lastAdaptedTelemetry,
                logs: window.gcsConnection?.logHistory || [],
                paramsLoaded: window.paramCache?.loaded ?? false
            });

            // Sebagian konsumsi param menunggu event ini (mis. tab PID di config)
            frameWindow.dispatchEvent(new Event('paramCacheUpdated'));
        }

        function activateFrame(frameId) {
            const frame = document.getElementById(frameId);
            if (!frame) return;

            // Sudah aktif: tidak perlu toggle class maupun resync
            if (activeFrameId === frameId && frame.classList.contains('active')) return;

            const previousFrameId = activeFrameId;
            document.querySelectorAll('.app-iframe').forEach(f => f.classList.remove('active'));
            frame.classList.add('active');
            activeFrameId = frameId;

            setFrameActiveFlag(previousFrameId, false);
            setFrameActiveFlag(frameId, true);

            // Badge pesan penting hanya relevan sampai pesannya tampil di Flight View
            if (frameId === 'frame-flight') hideImportantBadge();

            if (frameReady[frameId]) syncFrame(frameId);
        }

        // Selesai load iframe: tanda siap, dan sinkronkan langsung bila frame ini
        // justru yang aktif (bisa saja user sudah navigasi sebelum iframe selesai).
        function onFrameLoaded(frameId) {
            frameReady[frameId] = true;
            if (frameId === activeFrameId) {
                setFrameActiveFlag(frameId, true);
                syncFrame(frameId);
            }
        }

        function routeTelemetry(raw) {
            // FIX: radioMavlink dan udpMavlink SAMA-SAMA memanggil routeTelemetry.
            // Kalau kedua link kebetulan aktif bersamaan (mis. link satunya belum
            // sempat disconnect dengan bersih), keduanya akan menimpa UI secara
            // bergantian tanpa guard ini -- itulah sumber status yang "flicker".
            // Hanya proses telemetry dari link yang sedang dipilih user di dropdown.
            const activeType = document.getElementById('connTypeSelect')?.value;
            const expectedLink = (activeType === 'serial') ? 'radio' : 'udp';
            if (raw && raw.link && raw.link !== expectedLink) {
                return;
            }

            const adaptedData = window.adaptRadioTelemetry(raw);

            // Master state selalu diperbarui (source of truth semua frame)
            if (window.gcsConnection && window.gcsConnection.telemetry) {
                window.gcsConnection.telemetry.updateFromApi(adaptedData);
            }
            lastAdaptedTelemetry = adaptedData;

            // Render hanya ke frame aktif; frame lain disinkronkan saat diaktifkan
            deliverToActiveFrame('updateTelemetryUI', adaptedData);
        }

        const MAVLOG_HISTORY_MAX = 500;
        function pushLogHistory(logItem) {
            if (!window.gcsConnection) return;
            if (!Array.isArray(window.gcsConnection.logHistory)) window.gcsConnection.logHistory = [];
            window.gcsConnection.logHistory.push(logItem);
            if (window.gcsConnection.logHistory.length > MAVLOG_HISTORY_MAX) {
                window.gcsConnection.logHistory.shift();
            }
        }

        function routeMavlog(logItem) {
            if (!logItem) return;

            // Master history selalu ditulis (ring buffer, sumber replay semua frame).
            // Item hasil addLog punya `seq` yang dipakai sebagai kursor replay di frame.
            const storedItem = window.gcsConnection?.addLog(
                logItem.text,
                logItem.severity ?? 6,
                logItem.source ?? 'FC'
            );

            // Render hanya ke frame aktif; frame lain mereplay lewat syncFrame()
            deliverToActiveFrame('updateMavlogUI', storedItem || logItem);

            // Pesan penting yang datang saat user tidak berada di Flight View
            // ditandai di navbar, bukan di-frame-kan ke halaman yang tersembunyi.
            if (isImportantLog(logItem) && activeFrameId !== 'frame-flight') {
                showImportantBadge();
            }
        }

        function isImportantLog(logItem) {
            const severity = logItem?.severity ?? 6;
            const text = String(logItem?.text || '');
            return severity <= IMPORTANT_LOG_SEVERITY_MAX || text.includes(SAR_LOG_MARKER);
        }

        function showImportantBadge() {
            document.getElementById('importantBadge')?.style.setProperty('display', 'inline-block');
        }

        function hideImportantBadge() {
            document.getElementById('importantBadge')?.style.setProperty('display', 'none');
        }

        function handleLinkConnect() {
            updateNavbarStatus();
            setTimeout(loadAllParams, 2000);
        }
        function handleLinkDisconnect() {
            updateNavbarStatus();
            window.paramCache.loaded = false;
            window.paramCache.params = {};
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.app-iframe').forEach(frame => {
                // Load dari file:// sangat cepat dan bisa kelewatan sebelum listener
                // terpasang; readyState 'complete' berarti semua script frame sudah jalan.
                if (frame.contentDocument?.readyState === 'complete') {
                    onFrameLoaded(frame.id);
                } else {
                    frame.addEventListener('load', () => onFrameLoaded(frame.id));
                }
            });

            window.radioMavlink.onTelemetry = routeTelemetry;
            window.radioMavlink.onMavlog = routeMavlog;
            window.udpMavlink.onTelemetry = routeTelemetry;
            window.udpMavlink.onMavlog = routeMavlog;
        });

        window.paramCache = {
            params: {},
            loaded: false,
            loading: false,
            progress: { count: 0, total: null}
        };

        function showParamLoadingOverlay(show, count = 0, total = null) {
            const el = document.getElementById('paramLoadingBanner');

            if (typeof show === 'number') {
                total = count;
                count = show;
                show = true;
            }

            el.style.display = show ? 'flex' : 'none';
            if (show) {
                const totalStr = (total && total > 0) ? ` / ${total}` : '';
                document.getElementById('paramLoadingText').innerText = `Getting parameters from FC... (${count}${totalStr})`;
            }
        }

        async function loadAllParams() {
            if(window.paramCache.loading) return;
            window.paramCache.loading = true;
            window.paramCache.loaded = false;
            showParamLoadingOverlay(true, 0, null);

            try {
                const params = await window.commands.getAllParams((count, total) => {
                    window.paramCache.progress = { count, total };
                    showParamLoadingOverlay(count, total);
                });
                window.paramCache.params = params;
                window.paramCache.loaded = true;

                // Hanya frame aktif yang direfresh; frame lain disinkronkan lewat
                // syncFrame() saat diaktifkan (supaya tidak update frame tersembunyi)
                getActiveFrame()?.contentWindow?.dispatchEvent(new Event('paramCacheUpdated'));
            } catch (err) {
                console.error('Gagal memuat parameter:', err);
                alert('Gagal memuat parameter: ' + err.message);
            } finally {
                window.paramCache.loading = false;
                showParamLoadingOverlay(false);
            }

        }

        function handleAccelCalPosRequest(posNumber) {
            window.acceptCalStep = posNumber;
            const frame = getActiveFrame();
            if (frame?.contentWindow?.onAccelCalPosPrompt) {
                frame.contentWindow.onAccelCalPosPrompt(posNumber);
            }
        }

        function handleAccelCalPosSignal(param1) {
            const frame = getActiveFrame();
            if (frame?.contentWindow?.onAccelCalPosSignal) {
                frame.contentWindow.onAccelCalPosSignal(param1);
            }
        }
        
        window.radioMavlink.onConnect = handleLinkConnect;
        window.radioMavlink.onDisconnect = handleLinkDisconnect;
        window.udpMavlink.onConnect = handleLinkConnect;
        window.udpMavlink.onDisconnect = handleLinkDisconnect;
        window.radioMavlink.onAccelCalPosRequest = handleAccelCalPosRequest;
        window.udpMavlink.onAccelCalPosRequest = handleAccelCalPosRequest;
        window.radioMavlink.onAccelCalPosSignal = handleAccelCalPosSignal;
        window.udpMavlink.onAccelCalPosSignal = handleAccelCalPosSignal;

        // Navigasi mencakup semua frame (flight/setup/mission/config) lewat
        // activateFrame(), yang menangani flag siaga dan sinkronisasi state.
        function navigateTo(url, el) {
            let targetFrameId = 'frame-flight';
            if (url.includes('setup.html')) targetFrameId = 'frame-setup';
            else if (url.includes('mission.html')) targetFrameId = 'frame-mission';
            else if (url.includes('config.html')) targetFrameId = 'frame-config';

            activateFrame(targetFrameId);

            document.querySelectorAll('.nav-left a').forEach(a => a.classList.remove('active'));
            if (el) el.classList.add('active');

            const camBtn = document.getElementById('nav-camera');
            if (camBtn) {
                camBtn.style.display = (url === './flightview.html') ? 'inline-block' : 'none';
            }
        }

        function triggerCamera() {
            const frame = getActiveFrame();
            if (frame.contentWindow && typeof frame.contentWindow.openVideo === 'function') {
                frame.contentWindow.openVideo();
            }
        }

        function toggleConnType() {
           const type = document.getElementById('connTypeSelect').value;
            const serialGroup = document.getElementById('serialGroup');
            const ipGroup = document.getElementById('ipGroup');
            
            if (type === 'serial') {
                if (serialGroup) serialGroup.style.display = 'flex';
                if (ipGroup) ipGroup.style.display = 'none';
            } else {
                if (serialGroup) serialGroup.style.display = 'none';
                if (ipGroup) ipGroup.style.display = 'flex'; 
            }
            updateNavbarStatus();
        }

        async function handleSelectRadioPort() {
            if (!window.radioMavlink) { alert('Modul radio-mavlink.js belum termuat.'); return; }
            const select = document.getElementById('portSelect');
            try {
                const ports = await window.radioMavlink.requestPort();
                if (!select) return;
                if (!ports || ports.length === 0) {
                    select.innerHTML = '<option value="">Tidak ada port terdeteksi</option>';
                    return;
                }
                select.innerHTML = ports.map(p =>
                    `<option value="${p.path}">${p.path}${p.manufacturer ? ' — ' + p.manufacturer : ''}</option>`
                ).join('');
            } catch (err) {
                console.error('Gagal scan port radio:', err);
                if (select) select.innerHTML = '<option value="">Gagal scan port</option>';
            }
        }

        async function connectRadio() {
            const statusEl = document.getElementById('statusText');
            const portSelect = document.getElementById('portSelect');
            const selectedPath = portSelect?.value;

            if (!window.radioMavlink || !selectedPath || selectedPath === 'Scanning ports...') {
                alert('Pilih port radio dulu (tombol "Scan").');
                return;
            }
            const baud = parseInt(document.getElementById('baudSelect').value, 10);
            statusEl.textContent = 'Connecting radio...';
            try {
                await window.radioMavlink.connect(baud, selectedPath);
            } catch (err) {
                alert('Gagal connect radio: ' + err.message);
            }
            updateNavbarStatus();
        }

        async function disconnectRadio() {
            if (window.radioMavlink) {
                window.RadioMavlink.autoReconnect = false;
                await window.radioMavlink.disconnect();
            }
            updateNavbarStatus();
        }

        async function connectUdp() {
            const host = document.getElementById('ipHostInput').value.trim();
            const port = document.getElementById('ipPortInput').value.trim();
            const statusEl = document.getElementById('statusText');
            
            if (!host || !port) {
                alert('IP dan Port wajib diisi!');
                return;
            }

            statusEl.textContent = 'Connecting UDP...';
            try {
                await window.udpMavlink.connect(host, port);
            } catch (err) {
                alert('Gagal connect UDP: ' + err.message);
            }
            updateNavbarStatus();
        }

        async function disconnectUdp() {
            if (window.udpMavlink) {
                await window.udpMavlink.disconnect();
            }
            updateNavbarStatus();
        }

        async function handleMainConnect() {
            const type = document.getElementById('connTypeSelect').value;
            const isRadioConnected = !!(window.radioMavlink && window.radioMavlink.telemetry?.connected);
            const isUdpConnected = !!(window.udpMavlink && window.udpMavlink.telemetry?.connected);

            if (type === 'serial') {
                if (isUdpConnected) await disconnectUdp();
                if (isRadioConnected) {
                    await disconnectRadio();
                } else {
                    await connectRadio();
                }
            } else {
                if (isRadioConnected) await disconnectRadio();
                if (isUdpConnected) {
                    await disconnectUdp();
                } else {
                    await connectUdp();
                }
            }
            updateNavbarStatus();
        }

        function updateNavbarStatus() {
            const type = document.getElementById('connTypeSelect')?.value;
            const statusEl = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            if (!statusEl || !connectBtn) return;

            let connected = false;
            if (type === 'serial') {
                connected = !!(window.radioMavlink && window.radioMavlink.telemetry?.connected);
            } else {
                connected = !!(window.udpMavlink && window.udpMavlink.telemetry?.connected);
            }

            statusEl.textContent = connected ? 'Connected' : 'Disconnected';
            connectBtn.textContent = connected ? 'Disconnect' : 'Connect';

            if (connected) {
                statusEl.style.color = '#4caf50';
                statusEl.style.backgroundColor = 'rgba(76, 175, 80, 0.15)';
                statusEl.style.borderColor = '#4caf50';
                statusEl.classList.remove('disconnected');
                statusEl.classList.add('connected');
            } else {
                statusEl.style.color = '#f44336';
                statusEl.style.backgroundColor = 'rgba(244, 67, 54, 0.15)';
                statusEl.style.borderColor = '#f44336';
                statusEl.classList.remove('connected');
                statusEl.classList.add('disconnected');
            }
        }

        setInterval(updateNavbarStatus, 5000);
    </script>
</body>
</html>
